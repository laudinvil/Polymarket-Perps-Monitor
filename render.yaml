services:
  - type: web
    name: polymarket-soccer-monitor
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"
      - key: MONITOR_MODE
        value: monitor
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CONVEX_SITE_URL
        sync: false
