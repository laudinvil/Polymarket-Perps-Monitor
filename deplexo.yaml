framework: node
install: npm ci
start: node scripts/deplexo-log-server.js
port: 3000


# STRICT DEDUPE RULE — HIGHEST PRIORITY
# Deplexo is diagnostics only. Alert deduplication MUST NOT depend on Deplexo availability.
# The monitor atomically claims CS2_MAP1:<PandaScore match id> in GitHub state before Telegram.
# A successful claim is permanent. Duplicate claims are rejected.
# If the GitHub claim cannot be completed, FAIL CLOSED for that alert only and retry later.
# No external log server or Deplexo endpoint may block the monitor's alert path.
