name: Deploy Convex

on:
  push:
    branches: [main]
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Configure Convex secrets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -e
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$CONVEX_INGEST_TOKEN"
          npx convex env set CONVEX_INGEST_TOKEN "$CONVEX_INGEST_TOKEN" --prod
          if [ -n "$WORKFLOW_TOKEN" ]; then
            npx convex env set GITHUB_WORKFLOW_TOKEN "$WORKFLOW_TOKEN" --prod
            echo "Convex GitHub watchdog token configured"
          else
            echo "WARNING: WORKFLOW_TOKEN is not configured; Convex watchdog will remain inactive"
          fi

      - name: Deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Verify Convex health endpoint
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          set -e
          test -n "$CONVEX_URL"
          url="${CONVEX_URL%/}/health"
          echo "Checking Convex health endpoint"
          for i in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "$url" || true)
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Convex health: OK"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Convex health endpoint did not return ok=true"
          exit 1
