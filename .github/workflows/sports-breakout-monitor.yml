name: Sports Breakout Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: sports-breakout-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run continuous monitor with 5h45m restarts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          while true; do
            echo "STARTING SPORTS BREAKOUT MONITOR V3"
            timeout --signal=TERM --kill-after=30s 5h45m node sports-breakout-monitor-v3.js || true
            echo "RESTARTING SPORTS BREAKOUT MONITOR V3"
            sleep 5
          done
