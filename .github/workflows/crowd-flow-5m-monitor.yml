name: Crowd Flow 5M Monitor

on:
  schedule:
    - cron: '15 */5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/crowd-flow-5m-monitor.js'
      - 'src/polymarket.js'
      - 'src/telegram.js'
      - '.github/workflows/crowd-flow-5m-monitor.yml'

concurrency:
  group: crowd-flow-5m-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify monitor source
        run: node --check scripts/crowd-flow-5m-monitor.js
      - name: Run Crowd Flow 5M monitor
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: node scripts/crowd-flow-5m-monitor.js
