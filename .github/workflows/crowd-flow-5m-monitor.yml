name: Crowd Flow 5M Multi-Exchange Imbalance

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/crowd-flow-5m-monitor.js'

permissions:
  contents: read

concurrency:
  group: crowd-flow-5m-monitor-v2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - run: node --check scripts/crowd-flow-5m-monitor.js
      - name: Run Crowd Flow 5M Multi-Exchange Imbalance
        run: node scripts/crowd-flow-5m-monitor.js
