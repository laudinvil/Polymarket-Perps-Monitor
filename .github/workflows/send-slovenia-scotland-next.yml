name: Send Slovenia Scotland NEXT

on:
  push:
    paths:
      - '.github/workflows/send-slovenia-scotland-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve exact score and 1X2, then send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const get=async(url)=>{
            const r=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(10000)});
            const body=await r.text();
            if(!r.ok) throw new Error('HTTP '+r.status+' '+url+' '+body.slice(0,300));
            return JSON.parse(body);
          };
          const arr=v=>{
            if(Array.isArray(v)) return v;
            if(typeof v==='string'){try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch{return []}}
            if(v&&typeof v==='object'){
              for(const k of ['data','markets','results','items']) if(Array.isArray(v[k])) return v[k];
            }
            return [];
          };
          const norm=v=>String(v??'').replace(/\s+/g,' ').trim().toLowerCase();
          const prices=v=>arr(v).map(Number);
          console.log('MARKET_DIAGNOSTIC_RUN');
          const slug='unl-slv-sco-2026-09-26';
          const eventUrl='https://polymarket.com/ru/sports/unl/unl-slv-sco-2026-09-26';
          const home='slovenia',away='scotland';

          function parsePage(text){
            const raw=String(text||'');
            const decoded=raw.replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
            const all=raw+'\n'+decoded;
            const compact=all.replace(/\\s+/g,' ');
            const pctToNum=v=>{
              const n=Number(String(v).replace('%',''));
              return Number.isFinite(n)?(n>1?n/100:n):null;
            };
            let exact=null, odds=null;
            const exactPatterns=[
              /(?:Slovenia[^<]{0,120}1\\s*[-:]\\s*1[^<]{0,120}Scotland|Scotland[^<]{0,120}1\\s*[-:]\\s*1[^<]{0,120}Slovenia)[^%]{0,250}?(\\d{1,3}(?:\\.\\d+)?)%/i,
              /1\\s*[-:]\\s*1[^%]{0,180}?(\\d{1,3}(?:\\.\\d+)?)%/i
            ];
            for(const re of exactPatterns){const m=compact.match(re);if(m){exact=pctToNum(m[1]);if(exact!==null)break;}}
            const oneX=[
              /Slovenia[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%[^%]{0,200}Scotland/i,
              /1X2[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%[^%]{0,500}?(\\d{1,3}(?:\\.\\d+)?)%/i
            ];
            for(const re of oneX){const m=compact.match(re);if(m){const p=m.slice(1).map(pctToNum);if(p.every(x=>x!==null&&x>0)){odds=p;break;}}}
            return {exact,odds,source:"polymarket_html"};
          }


          let exact=null,odds=null,last='';
          for(let attempt=1;attempt<=12&&(exact===null||odds===null);attempt++){
            try{
              const page=await fetch(eventUrl,{headers:{'user-agent':'Mozilla/5.0','accept':'text/html,application/xhtml+xml'},signal:AbortSignal.timeout(10000)});
              const html=await page.text();
              const parsed=parsePage(html);
              exact=parsed.exact; odds=parsed.odds;
              if(attempt===1){
                for(const term of ['Slovenia','Scotland','1 - 1','1-1','Exact Score','Correct Score']){
                  let p=html.indexOf(term);
                  console.log('TERM '+term+' POS '+p);
                  if(p>=0) console.log(html.slice(Math.max(0,p-1200),p+2200).replace(/\\s+/g,' ').slice(0,3600));
                }
              }
              last=JSON.stringify({attempt,status:page.status,htmlLength:html.length,exact,odds,source:parsed.source});
              console.log(last);
            }catch(err){last=String(err.message);console.log(JSON.stringify({attempt,error:last}))}
            if(exact===null||odds===null) await sleep(5000);
          }
          if(exact===null||odds===null) throw new Error('Page market data not resolved: '+last);

          const pct=x=>Math.round(x*100)+'%';
          const msg=['⚽ NEXT','', 'Slovenia vs Scotland','1:1 YES: '+pct(exact),'','1: '+pct(odds[0])+' · X: '+pct(odds[1])+' · 2: '+pct(odds[2]),'','➡️ OPEN MATCH',eventUrl].join('\\n');
          const tg=await fetch('https://api.telegram.org/bot'+process.env.TELEGRAM_BOT_TOKEN+'/sendMessage',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,text:msg,disable_web_page_preview:false}),
            signal:AbortSignal.timeout(10000)
          });
          const tj=await tg.json();
          if(!tg.ok||!tj.ok) throw new Error('Telegram failed: HTTP '+tg.status+' '+JSON.stringify(tj));
          console.log(JSON.stringify({sent:true,messageId:tj.result.message_id,exact11:pct(exact),oneXTwo:odds.map(pct)}));
          NODE
