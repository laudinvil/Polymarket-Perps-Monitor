name: Remove All Workflows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-all-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all workflow files
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print -delete

      - name: Commit deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/workflows; then
            echo "No workflow files remain to delete."
            exit 0
          fi

          git add -A .github/workflows
          git commit -m "Remove all GitHub Actions workflows"
          git push origin HEAD:main
