name: Polymarket Soccer Live Alerts

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: polymarket-soccer-live-alerts
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live soccer monitor with persistent diagnostics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          MONITOR_MODE: ${{ github.event_name == 'push' && github.event.head_commit.message == 'DIAGNOSTIC_RUN' && 'diagnostic' || 'monitor' }}
        run: |
          set -o pipefail
          node scripts/polymarket-soccer-live-alerts.js 2>&1 | tee soccer-monitor.log
      - name: Upload persistent monitor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-monitor-diagnostics-${{ github.run_id }}
          path: soccer-monitor.log
          if-no-files-found: warn
          retention-days: 7
