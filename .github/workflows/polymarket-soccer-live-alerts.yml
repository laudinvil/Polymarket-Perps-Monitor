name: Polymarket Soccer Live Alerts

on:
  push:
    paths:
      - "scripts/polymarket-soccer-live-alerts.js"
      - ".github/workflows/polymarket-soccer-live-alerts.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: polymarket-soccer-live-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live soccer monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/polymarket-soccer-live-alerts.js
