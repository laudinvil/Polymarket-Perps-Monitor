name: OpenMarket · Hyperliquid BTC Raw Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openmarket-hyperliquid-btc-raw-test.yml"
      - "scripts/openmarket-hyperliquid-btc-raw-test.js"

concurrency:
  group: openmarket-hyperliquid-btc-raw-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run raw OpenMarket test
        env:
          OPENMARKET_API_KEY: ${{ secrets.OPENMARKET_API_KEY }}
        run: node scripts/openmarket-hyperliquid-btc-raw-test.js
