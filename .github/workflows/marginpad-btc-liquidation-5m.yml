name: MarginPad BTC Liquidation 5M

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/marginpad-btc-liquidation-5m.js'
      - 'src/liquidation-monitor.js'
      - 'src/polymarket.js'
      - 'src/telegram.js'
      - '.github/workflows/marginpad-btc-liquidation-5m.yml'

permissions:
  contents: read

concurrency:
  group: marginpad-btc-liquidation-5m
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BTC liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: node scripts/marginpad-btc-liquidation-5m.js
