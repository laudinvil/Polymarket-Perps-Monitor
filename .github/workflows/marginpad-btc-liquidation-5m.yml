name: MarginPad BTC Liquidation 5M

on:
  push:
    paths:
      - ".github/workflows/marginpad-btc-liquidation-5m.yml"
      - "scripts/marginpad-btc-liquidation-5m.js"
      - "src/liquidation-monitor.js"
      - "src/polymarket.js"
      - "src/telegram.js"
      - "package.json"
  schedule:
    - cron: "*/5 * * * *"
    # diagnostic trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marginpad-btc-liquidation-5m-diagnostics-20260922
  cancel-in-progress: false

jobs:
  monitor:
    name: BTC liquidation monitor
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Telegram connectivity test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          curl -fsS --max-time 10 \
            -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🔥 TEST · MarginPad BTC Liquidation Monitor"

      - name: Run BTC liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: node scripts/marginpad-btc-liquidation-5m.js
