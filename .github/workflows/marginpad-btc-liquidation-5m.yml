name: MarginPad BTC Liquidation 5M

on:
  push:
    paths:
      - ".github/workflows/marginpad-btc-liquidation-5m.yml"
      - "scripts/marginpad-btc-liquidation-5m.js"
      - "src/liquidation-monitor.js"
      - "src/polymarket.js"
      - "src/telegram.js"
      - "package.json"
  schedule:
    - cron: "*/5 * * * *"
    # diagnostic trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marginpad-btc-liquidation-5m-diagnostics-20260922
  cancel-in-progress: true

jobs:
  monitor:
    name: BTC liquidation monitor
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture raw MarginPad response
        run: |
          set +e
          : > marginpad-raw.txt
          for url in \
            "https://marginpad.io/api/v1/feed" \
            "https://marginpad.io/api/v1/liquidations/live?symbol=BTC&limit=400"
          do
            echo "===== $url =====" >> marginpad-raw.txt
            curl -sS --max-time 8 -D - -H "accept: application/json" -H "cache-control: no-cache" "$url" >> marginpad-raw.txt 2>&1
            echo >> marginpad-raw.txt
          done
          cat marginpad-raw.txt

      - name: Upload raw MarginPad response
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-raw-response
          path: marginpad-raw.txt
          retention-days: 1

      - name: Run BTC liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: node scripts/marginpad-btc-liquidation-5m.js
