name: Telegram Direct Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_SECRETS_MISSING"
            exit 1
          fi
          curl -fsS --max-time 10 -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -H "Content-Type: application/json" --data "$(python - <<'PY'
import json, os
print(json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": "DIRECT GITHUB TELEGRAM TEST"}))
PY
)"
