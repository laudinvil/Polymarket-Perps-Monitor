name: Telegram Schema Test

on:
  push:
    branches: [main]

jobs:
  send-test-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Send test Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node <<'NODE'
          const https = require("https");

          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          if (!token || !chatId) throw new Error("Telegram secrets are missing");

          const text = [
            "🧪 TEST ALERT",
            "",
            "⚽ LIVE FOUND",
            "",
            "CD Cobreloa Calama vs Santiago Wanderers",
            "LIVE · 65′",
            "SCORE: 2–1",
            "",
            "1X2",
            "• CD Cobreloa Calama",
            "• Draw",
            "• Santiago Wanderers",
            "",
            "EVENT VOLUME: $11,583",
            "EVENT LIQUIDITY: $700",
            "",
            "OPEN POLYMARKET"
          ].join("\n");

          const body = new URLSearchParams({
            chat_id: chatId,
            text,
            parse_mode: "HTML",
            reply_markup: JSON.stringify({
              inline_keyboard: [[
                {
                  text: "ОТКРЫТЬ POLYMARKET",
                  url: "https://polymarket.com/"
                }
              ]]
            })
          }).toString();

          const req = https.request({
            hostname: "api.telegram.org",
            path: "/bot" + token + "/sendMessage",
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Content-Length": Buffer.byteLength(body)
            }
          }, res => {
            let data = "";
            res.on("data", c => data += c);
            res.on("end", () => {
              console.log("TELEGRAM_HTTP", res.statusCode);
              console.log("TELEGRAM_RESPONSE", data);
              if (res.statusCode < 200 || res.statusCode >= 300) process.exitCode = 1;
            });
          });

          req.on("error", err => {
            console.error("TELEGRAM_REQUEST_ERROR", err.message);
            process.exitCode = 1;
          });
          req.write(body);
          req.end();
          NODE
