name: BTC 5M · Chainlink TWAP Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/btc-chainlink-twap-diagnostic.js"
      - ".github/workflows/btc-chainlink-twap-diagnostic.yml"

concurrency:
  group: btc-chainlink-twap-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chainlink SDK
        run: npm install --no-save @chainlink/data-streams-sdk

      - name: Compare TWAP sources
        env:
          CHAINLINK_DATA_STREAMS_API_KEY: ${{ secrets.CHAINLINK_DATA_STREAMS_API_KEY }}
          CHAINLINK_DATA_STREAMS_USER_SECRET: ${{ secrets.CHAINLINK_DATA_STREAMS_USER_SECRET }}
          CHAINLINK_DATA_STREAMS_FEED_ID: ${{ secrets.CHAINLINK_DATA_STREAMS_FEED_ID }}
        run: node scripts/btc-chainlink-twap-diagnostic.js

      - name: Restart monitor session
        if: always()
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "WORKFLOW_TOKEN is not configured; continuous restart cannot be scheduled."
            exit 1
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WORKFLOW_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/laudinvil/Polymarket-Perps-Monitor/actions/workflows/btc-chainlink-twap-diagnostic.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next diagnostic session dispatched."
