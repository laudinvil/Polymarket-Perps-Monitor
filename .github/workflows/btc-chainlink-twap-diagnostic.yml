name: BTC 5M · Chainlink TWAP Edge Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/btc-chainlink-twap-diagnostic.js"
      - ".github/workflows/btc-chainlink-twap-diagnostic.yml"

concurrency:
  group: btc-chainlink-twap-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chainlink SDK
        run: npm install --no-save @chainlink/data-streams-sdk

      - name: Deploy Convex logging backend
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -e
          npx convex deploy --typecheck=enable --codegen=disable --message "Deploy BTC 5M monitor logging"
        

      - name: Run BTC 5M edge monitor
        env:
          CHAINLINK_DATA_STREAMS_API_KEY: ${{ secrets.CHAINLINK_DATA_STREAMS_API_KEY }}
          CHAINLINK_DATA_STREAMS_USER_SECRET: ${{ secrets.CHAINLINK_DATA_STREAMS_USER_SECRET }}
          CHAINLINK_DATA_STREAMS_FEED_ID: ${{ secrets.CHAINLINK_DATA_STREAMS_FEED_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTC_5M_MIN_EDGE: "0.00"
          CONVEX_URL: "https://brainy-canary-207.eu-west-1.convex.cloud"
        run: node scripts/btc-chainlink-twap-diagnostic.js

      - name: Restart monitor session
        if: always()
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          CONVEX_URL: "https://brainy-canary-207.eu-west-1.convex.cloud"
        run: |
          set -euo pipefail

          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "WORKFLOW_TOKEN is not configured; continuous restart cannot be scheduled."
            exit 1
          fi

          log_convex() {
            local level="$1"
            local event="$2"
            local message="$3"
            local data="${4:-{}}"
            curl --silent --show-error --max-time 5               -X POST               -H "content-type: application/json"               "$CONVEX_URL/api/mutation"               -d "$(jq -cn                 --arg path "btc5mState:logBtc5m"                 --arg level "$level"                 --arg event "$event"                 --arg message "$message"                 --arg data "$data"                 '{path:$path,args:{level:$level,event:$event,message:$message,data:$data},format:"json"}')"               >/dev/null || echo "Convex persistence failed for $event"
          }

          log_convex "INFO" "session_finished" "BTC 5M monitor session finished" \
            "$(jq -cn --arg run "$GITHUB_RUN_ID" '{runId:$run}')"

          curl --fail-with-body -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $WORKFLOW_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/laudinvil/Polymarket-Perps-Monitor/actions/workflows/btc-chainlink-twap-diagnostic.yml/dispatches             -d '{"ref":"main"}'

          echo "Dispatch request accepted by GitHub."
          log_convex "INFO" "dispatch_sent" "Next BTC 5M monitor session dispatch sent" \
            "$(jq -cn --arg run "$GITHUB_RUN_ID" '{previousRunId:$run}')"

          found=""
          for i in $(seq 1 12); do
            sleep 5
            runs="$(curl --fail-with-body --silent               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $WORKFLOW_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/laudinvil/Polymarket-Perps-Monitor/actions/workflows/btc-chainlink-twap-diagnostic.yml/runs?event=workflow_dispatch&per_page=10")"

            found="$(echo "$runs" | jq -r --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[] | select((.id|tostring) != $current) |
               select(.status == "queued" or .status == "in_progress") |
               .id] | first // empty')"

            if [ -n "$found" ]; then
              echo "Next session detected: run $found"
              log_convex "INFO" "next_session_detected" "Next BTC 5M monitor session detected" \
                "$(jq -cn --arg run "$found" --arg previous "$GITHUB_RUN_ID" '{runId:$run,previousRunId:$previous}')"
              exit 0
            fi
          done

          echo "Dispatch was accepted, but no queued/in-progress successor was detected within 60 seconds."
          log_convex "ERROR" "next_session_not_detected" "Successor BTC 5M monitor session was not detected" \
            "$(jq -cn --arg previous "$GITHUB_RUN_ID" '{previousRunId:$previous}')"
          exit 1
