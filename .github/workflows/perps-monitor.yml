name: Polymarket Liquidation Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/imminent-alerted-positions.json'
      - 'src/spike-alerted-windows.json'
      - 'src/binance-spike-alerted-windows.json'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Run one IMMINENT diagnostic'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: polymarket-liquidation-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PINAX_API_KEY: ${{ secrets.PINAX_API_KEY }}
      PINAX_API_TOKEN: ${{ secrets.PINAX_API_TOKEN }}
      RUN_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == true }}
      DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run detailed IMMINENT diagnostic
        if: env.DIAGNOSTIC == 'true'
        run: node src/imminent-diagnostic.js 2>&1 | tee imminent-diagnostic.log
      - name: Run IMMINENT + SPIKE + BINANCE SPIKE monitors
        run: |
          node src/imminent-liquidation.js 2>&1 | tee imminent.log &
          PID_IMMINENT=$!
          node src/spike.js 2>&1 | tee spike.log &
          PID_SPIKE=$!
          node src/binance-spike.js 2>&1 | tee binance-spike.log &
          PID_BINANCE=$!
          wait $PID_IMMINENT
          STATUS_IMMINENT=$?
          wait $PID_SPIKE
          STATUS_SPIKE=$?
          wait $PID_BINANCE
          STATUS_BINANCE=$?
          test $STATUS_IMMINENT -eq 0 && test $STATUS_SPIKE -eq 0 && test $STATUS_BINANCE -eq 0
      - name: Persist monitor state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/imminent-alerted-positions.json src/spike-alerted-windows.json src/binance-spike-alerted-windows.json
          git diff --cached --quiet || git commit -m "Persist liquidation monitor state"
          git push
      - name: Upload diagnostic log
        if: always() && env.DIAGNOSTIC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-diagnostic
          path: |
            imminent-diagnostic.log
            imminent.log
            spike.log
            binance-spike.log
            src/imminent-alerted-positions.json
            src/spike-alerted-windows.json
            src/binance-spike-alerted-windows.json
          if-no-files-found: warn
          retention-days: 7
