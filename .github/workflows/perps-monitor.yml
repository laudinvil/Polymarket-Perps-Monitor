name: Polymarket Liquidation Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Run one closed-window diagnostic and upload the log'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: polymarket-liquidation-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PINAX_API_KEY: ${{ secrets.PINAX_API_KEY }}
      PINAX_API_TOKEN: ${{ secrets.PINAX_API_TOKEN }}
      RUN_ONCE: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.diagnostic == true) }}
      DIAGNOSTIC: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.diagnostic == true) }}
      IMMINENT_LIQUIDATION_PCT: '2'
      IMMINENT_LIQUIDATION_INTERVAL_MS: '300000'
      IMMINENT_LIQUIDATION_LOOKBACK_MS: '1800000'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Pinax unfiltered probe
        if: env.DIAGNOSTIC == 'true'
        run: node src/pinax-probe.js 2>&1 | tee probe.log

      - name: Run liquidation monitors
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            node src/imminent-liquidation.js 2>&1 | tee imminent.log &
            IMMINENT_PID=$!
            node src/index.js 2>&1 | tee monitor.log
            STATUS=$?
            wait $IMMINENT_PID 2>/dev/null || true
            exit $STATUS
          else
            node src/imminent-liquidation.js 2>&1 | tee imminent.log &
            IMMINENT_PID=$!
            node src/index.js 2>&1 | tee monitor.log
            STATUS=$?
            kill $IMMINENT_PID 2>/dev/null || true
            wait $IMMINENT_PID 2>/dev/null || true
            exit $STATUS
          fi

      - name: Persist imminent alert state
        if: always()
        run: |
          if [ -f src/imminent-alerted-positions.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/imminent-alerted-positions.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist imminent liquidation alert state [skip ci]"
              git push
            else
              echo "No imminent alert state changes to persist."
            fi
          else
            echo "No imminent alert state file found."
          fi

      - name: Upload diagnostic log
        if: always() && env.DIAGNOSTIC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-diagnostic
          path: |
            monitor.log
            imminent.log
            probe.log
          if-no-files-found: warn
          retention-days: 7
