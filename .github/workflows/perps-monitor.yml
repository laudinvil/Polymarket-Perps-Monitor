name: Polymarket Liquidation Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Run one IMMINENT + SPIKE diagnostic'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: polymarket-liquidation-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PINAX_API_KEY: ${{ secrets.PINAX_API_KEY }}
      PINAX_API_TOKEN: ${{ secrets.PINAX_API_TOKEN }}
      RUN_ONCE: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.diagnostic == true) }}
      DIAGNOSTIC: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.diagnostic == true) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Pinax unfiltered probe
        if: env.DIAGNOSTIC == 'true'
        run: node src/pinax-probe.js 2>&1 | tee probe.log
      - name: Run IMMINENT liquidation monitor
        run: node src/imminent-liquidation.js 2>&1 | tee imminent.log
      - name: Run Hyperliquid SPIKE monitor
        run: node src/spike.js 2>&1 | tee spike.log
      - name: Upload diagnostic log
        if: always() && env.DIAGNOSTIC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-diagnostic
          path: |
            imminent.log
            spike.log
            probe.log
            src/imminent-alerted-positions.json
            src/spike-alerted-windows.json
          if-no-files-found: warn
          retention-days: 7
