name: Polymarket Perps Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: perps-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_ON_START: 'false'
      IMBALANCE_THRESHOLD: '0.40'
      LARGE_ORDER_USD: '100000'
      LIQUIDITY_PULL_THRESHOLD: '0.40'
      SPREAD_MULTIPLIER: '3'
      COOLDOWN_MS: '120000'
      BOOK_LEVELS: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Run monitor
        run: node src/index.js
