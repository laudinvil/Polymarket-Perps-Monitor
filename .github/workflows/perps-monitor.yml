name: Polymarket Perps Composite Monitor

on:
  workflow_dispatch:

# Starting the new composite monitor cancels any older monitor run in this group.
concurrency:
  group: perps-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERTS_ENABLED: 'true'
      REQUIRE_PREDICTION_MARKET: 'true'
      SIGNAL_COOLDOWN_MS: '300000'
      PRICE_MOVE_5M: '0.015'
      OI_MOVE_5M: '0.05'
      FUNDING_LONG: '0.0003'
      FUNDING_SHORT: '-0.0003'
      MIN_VOLUME_MULTIPLIER: '3'
      HISTORY_BUCKETS: '12'
      MIN_BASELINE_BUCKETS: '3'
      SIGNAL_SCORE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run composite monitor
        run: node src/index.js
