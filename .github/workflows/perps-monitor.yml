name: Polymarket Liquidation Monitor

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Run one closed-window diagnostic and upload the log'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: polymarket-liquidation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PINAX_API_KEY: ${{ secrets.PINAX_API_KEY }}
      PINAX_API_TOKEN: ${{ secrets.PINAX_API_TOKEN }}
      RUN_ONCE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == true }}
      DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Pinax unfiltered probe
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == true
        run: node src/pinax-probe.js 2>&1 | tee probe.log

      - name: Run liquidation monitor
        run: node src/index.js 2>&1 | tee monitor.log

      - name: Upload diagnostic log
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic == true
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-diagnostic
          path: |
            monitor.log
            probe.log
          if-no-files-found: warn
          retention-days: 7
