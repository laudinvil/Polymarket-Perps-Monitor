name: Football monitor · Convex diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"
  push:
    paths:
      - ".github/workflows/football-convex-diagnostics.yml"
      - "convex/**"
      - "scripts/polymarket-football-live.js"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read Convex football health and status
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl -fsS --max-time 15             "https://brainy-canary-207.eu-west-1.convex.site/football/health"             -o diagnostics/football-health.json
          curl -fsS --max-time 20             "https://brainy-canary-207.eu-west-1.convex.site/football/status"             -o diagnostics/football-status.json

          node - <<'NODE'
          const fs = require("fs");
          const health = JSON.parse(fs.readFileSync("diagnostics/football-health.json", "utf8"));
          const status = JSON.parse(fs.readFileSync("diagnostics/football-status.json", "utf8"));
          const logs = Array.isArray(status.recentLogs) ? status.recentLogs : [];
          const latest = logs.slice().sort((a,b) => Number(b.createdAt||0) - Number(a.createdAt||0)).slice(0, 50);
          const summaries = latest.filter(x => x.event === "cycle_summary");
          const refreshes = latest.filter(x => x.event === "nutmeg_refresh");
          const out = {
            fetchedAt: new Date().toISOString(),
            health,
            stats: status.stats || null,
            latestCycleSummary: summaries[0] || null,
            latestNutmegRefresh: refreshes[0] || null,
            latestLogs: latest
          };
          fs.writeFileSync("diagnostics/football-diagnostics.json", JSON.stringify(out, null, 2));
          NODE

          echo "=== HEALTH ==="
          cat diagnostics/football-health.json
          echo
          echo "=== LATEST CYCLE / NUTMEG ==="
          node -e 'const x=require("./diagnostics/football-diagnostics.json"); console.log(JSON.stringify({latestCycleSummary:x.latestCycleSummary,latestNutmegRefresh:x.latestNutmegRefresh},null,2))'

      - name: Upload Convex diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-convex-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
