name: Football monitor · Convex diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/football-convex-diagnostics.yml"
      - "convex/**"
      - "scripts/polymarket-football-live.js"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Read Convex football health
        run: |
          set +e
          mkdir -p diagnostics
          curl --silent --show-error --max-time 15 -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://brainy-canary-207.eu-west-1.convex.site/football/health" \
            -o diagnostics/football-health.json
          health_rc=$?
          curl --silent --show-error --max-time 20 -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://brainy-canary-207.eu-west-1.convex.site/football/status" \
            -o diagnostics/football-status.json
          status_rc=$?
          echo "Health curl exit: $health_rc"
          echo "Status curl exit: $status_rc"
          echo "Health:"
          cat diagnostics/football-health.json || true
          echo
          echo "Status:"
          cat diagnostics/football-status.json || true

      - name: Upload Convex diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-convex-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
