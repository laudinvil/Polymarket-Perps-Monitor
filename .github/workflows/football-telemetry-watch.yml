name: Football telemetry watch
run-name: Football telemetry snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Convex football health
        env:
          CONVEX_SITE_URL: https://brainy-canary-207.eu-west-1.convex.site
        run: |
          set -e
          mkdir -p telemetry
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$ts" | tee telemetry/meta.txt
          curl --fail --silent --show-error --max-time 15 \
            "$CONVEX_SITE_URL/football/health" | tee telemetry/health.json
          echo
          curl --fail --silent --show-error --max-time 20 \
            "$CONVEX_SITE_URL/football/status" | tee telemetry/status.json

      - name: Upload telemetry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: football-telemetry
          path: telemetry/
          retention-days: 7
