name: Crowd Flow Stats HTTP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: crowd-flow-stats-http
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read fresh Convex stats
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          set -euo pipefail
          test -n "$CONVEX_URL"
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            "$CONVEX_URL/crowd-flow/periods?symbol=BTC&limit=100" \
            -o .github/deploy-status/crowd-flow.json
          jq . .github/deploy-status/crowd-flow.json
      - name: Publish latest snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-status/crowd-flow.json
          git diff --cached --quiet && exit 0
          git commit -m "Record fresh Crowd Flow stats"
          git push origin HEAD:main
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: crowd-flow-stats-${{ github.run_id }}
          path: .github/deploy-status/crowd-flow.json
          retention-days: 7
