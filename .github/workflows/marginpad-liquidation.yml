name: MarginPad Liquidation 5M

on:
  workflow_dispatch:
  push:
    paths:
      - monitor-start.trigger

concurrency:
  group: marginpad-liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run continuous MarginPad Hyperliquid liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: /tmp/marginpad-liquidation-state.json
          LOG_FILE: /tmp/marginpad-liquidation.jsonl
        run: |
          while true; do
            node monitor.js
            code=$?
            echo "MONITOR_EXIT code=$code; restarting in 0.5s"
            sleep 0.5
          done
