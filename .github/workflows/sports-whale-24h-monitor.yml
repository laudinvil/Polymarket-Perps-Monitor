name: Sports Whale 24H Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sports-whale-24h-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run sports whale monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 240 node scripts/sports-whale-24h-monitor.js 2>&1 | tee sports-whale-24h.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-whale-24h-log
          path: sports-whale-24h.log
