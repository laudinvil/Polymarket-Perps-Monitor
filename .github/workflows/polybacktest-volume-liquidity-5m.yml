name: PolyBackTest Volume Liquidity 5M

on:
  workflow_dispatch:
  schedule:
    # Start on every 5-minute boundary; the script keeps polling until the
    # newly resolved market appears, so the alert is sent as soon as the
    # previous 5-minute period is finalized.
    - cron: '*/5 * * * *'

concurrency:
  group: polybacktest-volume-liquidity-5m
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run PolyBackTest monitor
        env:
          POLYBACKTEST_API_KEY: ${{ secrets.POLYBACKTEST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/polybacktest-volume-liquidity-5m.js
