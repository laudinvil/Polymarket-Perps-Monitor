name: PolyBackTest Volume Liquidity 5M

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/polybacktest-volume-liquidity-5m.js'
      - '.github/workflows/polybacktest-volume-liquidity-5m.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: polybacktest-volume-liquidity-5m
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run PolyBackTest monitor
        env:
          POLYBACKTEST_API_KEY: ${{ secrets.POLYBACKTEST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/polybacktest-volume-liquidity-5m.js
