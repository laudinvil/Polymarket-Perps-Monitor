name: PolyBackTest Volume + Liquidity 5M
# push-trigger verification

on:
  push:
    paths:
      - 'scripts/polybacktest-volume-liquidity-5m.js'
      - '.github/workflows/polybacktest-volume-liquidity-5m.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'

concurrency:
  group: polybacktest-5m-combined
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run combined volume and liquidity monitor
        run: node scripts/polybacktest-volume-liquidity-5m.js
        env:
          POLYBACKTEST_API_KEY: ${{ secrets.POLYBACKTEST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
