name: PolyBackTest Volume 5M

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/polybacktest-volume-liquidity-5m.yml'
  schedule:
    - cron: '7 */6 * * *'

concurrency:
  group: polybacktest-volume-5m
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run PolyBackTest volume monitor
        run: node scripts/polybacktest-volume-liquidity-5m.js
        env:
          POLYBACKTEST_API_KEY: ${{ secrets.POLYBACKTEST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
