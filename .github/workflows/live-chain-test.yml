name: LIVE CHAIN TEST

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run external LIVE -> Polymarket -> Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          node --version
          node <<'NODE'
          const LIVE_URL = "https://sportscore.com/api/v1/fixtures/?sport=football&status=live&limit=200";
          const POLY_URL = "https://gamma-api.polymarket.com/events?active=true&closed=false&tag_slug=soccer&limit=500";
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").replace(/\b(fc|afc|cf|sc|ac|club|women|w|u19|u20|u21|u23)\b/g," ").replace(/\s+/g," ").trim();
          const sim=(a,b)=>{const A=new Set(norm(a).split(" ").filter(x=>x.length>2)),B=new Set(norm(b).split(" ").filter(x=>x.length>2));if(!A.size||!B.size)return 0;let h=0;for(const x of A)if(B.has(x))h++;return h/Math.max(A.size,B.size)};
          const startMs=o=>{const v=o?.startTime??o?.start_time??o?.startDate??o?.start_date??o?.startsAt??o?.starts_at??o?.commenceTime??o?.commence_time; if(v==null)return null; const n=Number(v); if(Number.isFinite(n))return n<1e12?n*1000:n; const d=Date.parse(String(v)); return Number.isFinite(d)?d:null};
          const minuteKey=ms=>ms==null?null:Math.floor(ms/60000);
          const extract=(n,o=[])=>{if(!n||typeof n!=="object")return o;if(Array.isArray(n)){for(const x of n)extract(x,o);return o}const h=n.home?.name||n.homeTeam?.name||n.homeTeamName||n.home,a=n.away?.name||n.awayTeam?.name||n.awayTeamName||n.away,st=n.status,so=st&&typeof st==="object"?st:{},live=n.live===true||n.isLive===true||(typeof st==="string"&&/live|in.?progress|halftime|break/i.test(st)),started=so.started===true||n.started===true,finished=so.finished===true||n.finished===true;if(h&&a&&!finished&&(live||started)){const sh=n.home?.score??n.homeScore??n.score?.home??n.scoreHome,sa=n.away?.score??n.awayScore??n.score?.away??n.scoreAway,raw=n.minute??n.elapsed??n.time??so.minute??so.elapsed??"—";o.push({home:String(h),away:String(a),score:sh!=null&&sa!=null?sh+"–"+sa:"—",minute:String(raw),startMs:startMs(n)});return o}for(const v of Object.values(n))extract(v,o);return o};
          const json=async u=>{const r=await fetch(u,{headers:{accept:"application/json"},signal:AbortSignal.timeout(15000)});console.log("HTTP",r.status,u);if(!r.ok)throw Error(u+" HTTP "+r.status);return r.json()};
          const ld=await json(LIVE_URL),live=extract(ld); const now=new Date(); const from=new Date(now.getTime()-3*86400000).toISOString(); const to=new Date(now.getTime()+3*86400000).toISOString(); const base="https://gamma-api.polymarket.com/events?active=true&closed=false&limit=100"; const buckets=["soccer","football","epl","premier-league","la-liga","bundesliga","serie-a","ligue-1","mls","champions-league","europa-league"]; const pages=await Promise.all(buckets.map(async tag=>{try{const p=await json(base+"&tag_slug="+encodeURIComponent(tag)+"&start_date_min="+encodeURIComponent(from)+"&start_date_max="+encodeURIComponent(to));return Array.isArray(p)?p:(p.events||[])}catch{return[]}})); const events=[...new Map(pages.flat().map(e=>[String(e.id),e])).values()];
          console.log("LIVE_COUNT",live.length); console.log("POLY_EVENT_COUNT",events.length); const candidates=[]; for(const e of events){const title=String(e.title||e.name||""); const qs=(Array.isArray(e.markets)?e.markets:[]).map(m=>String(m.question||m.title||"")).filter(q=>/\b(?:vs\.?|v\.?|versus)\b/i.test(q)); if(/\b(?:vs\.?|v\.?|versus)\b/i.test(title)||qs.length)candidates.push({id:e.id,title,slug:e.slug,startDate:e.startDate,endDate:e.endDate,keys:Object.keys(e),questions:qs.slice(0,3),marketKeys:Array.isArray(e.markets)&&e.markets[0]?Object.keys(e.markets[0]):[]});} console.log("MATCH_CANDIDATES",JSON.stringify(candidates.slice(0,30)));
          console.log("POLY_SAMPLE",JSON.stringify(events.slice(0,5).map(e=>({id:e.id,title:e.title,name:e.name,slug:e.slug,startTime:e.startTime,startDate:e.startDate,endDate:e.endDate,homeTeamName:e.homeTeamName,awayTeamName:e.awayTeamName,homeTeam:e.homeTeam,awayTeam:e.awayTeam,markets:e.markets})),null,2).slice(0,12000));
          let found=null; for(const l of live)for(const e of events){ const title=String(e.title||e.name||""); const q=(Array.isArray(e.markets)?e.markets:[]).map(m=>String(m.question||m.title||"")).join(" | "); const sourceTitle=title.includes(" vs ")||title.includes(" v ") ? title : q.split(" | ").find(x=>/\s+(?:vs\.?|v\.?|versus)\s+/i.test(x))||title; const parts=sourceTitle.split(/\s+(?:vs\.?|v\.?|versus)\s+/i); if(parts.length!==2)continue; const h=parts[0].trim(),a=parts[1].trim(); const score=Math.max(sim(l.home,h)+sim(l.away,a),sim(l.home,a)+sim(l.away,h)); const polyStart=e.startTime||e.eventDate||(Array.isArray(e.markets)&&e.markets[0]?.gameStartTime)||e.startDate; const le=minuteKey(l.startMs),ee=minuteKey(startMs({...e,startTime:polyStart})); if(le==null||ee==null||le!==ee||score<1.25)continue; if(!found||score>found.score)found={l,e,score,timeOk:true,startMinute:le,polyHome:h,polyAway:a}; };
          console.log("BEST_MATCH",found?JSON.stringify({live:found.l,title:found.e.title,id:found.e.id,slug:found.e.slug,score:found.score}):"NONE");
          if(!process.env.TELEGRAM_BOT_TOKEN||!process.env.TELEGRAM_CHAT_ID)throw Error("GitHub Telegram secrets are missing");
          const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
          const link=found?.e?.slug?"https://polymarket.com/event/"+found.e.slug:"https://polymarket.com/sports/soccer";
          const text=found&&found.score>=1.25?"⚽ <b>CHAIN TEST</b>\n\n"+esc(found.l.home)+" vs "+esc(found.l.away)+"\nLIVE\nMINUTE: "+esc(found.l.minute)+"\nSCORE: "+esc(found.l.score)+"\n\n<a href=\""+esc(link)+"\">ОТКРЫТЬ POLYMARKET</a>":"⚠️ <b>CHAIN TEST</b>\n\nExternal LIVE or Polymarket match was not found.\nLIVE: "+live.length+"\nPOLYMARKET EVENTS: "+events.length;
          const tr=await fetch("https://api.telegram.org/bot"+process.env.TELEGRAM_BOT_TOKEN+"/sendMessage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,parse_mode:"HTML",text})}),tj=await tr.json();console.log("TELEGRAM_RESPONSE",JSON.stringify(tj));if(!tj.ok)throw Error("Telegram rejected: "+JSON.stringify(tj));
          NODE