name: LIVE FOOTBALL MONITOR

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: live-football-monitor
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LIVE football monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          node --version
          node <<'NODE'
          const LIVE_URL = "https://sportscore.com/api/v1/fixtures/?sport=football&status=live&limit=200";
          const POLY_URL = "https://gamma-api.polymarket.com/events?active=true&closed=false&tag_slug=soccer&limit=500";
          const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").replace(/\b(fc|afc|cf|sc|ac|club|women|w|u19|u20|u21|u23)\b/g," ").replace(/\s+/g," ").trim();
          const sim=(a,b)=>{const A=new Set(norm(a).split(" ").filter(x=>x.length>2)),B=new Set(norm(b).split(" ").filter(x=>x.length>2));if(!A.size||!B.size)return 0;let h=0;for(const x of A)if(B.has(x))h++;return h/Math.max(A.size,B.size)};
          const startMs=o=>{const v=o?.startTime??o?.start_time??o?.startDate??o?.start_date??o?.startsAt??o?.starts_at??o?.commenceTime??o?.commence_time??o?.start??o?.start_at??o?.startAt??o?.date??o?.datetime??o?.minute; if(v==null)return null; const n=Number(v); if(Number.isFinite(n))return n<1e12?n*1000:n; const d=Date.parse(String(v)); return Number.isFinite(d)?d:null};
          const minuteKey=ms=>ms==null?null:Math.floor(ms/60000);
          const extract=(n,o=[])=>{if(!n||typeof n!=="object")return o;if(Array.isArray(n)){for(const x of n)extract(x,o);return o}const h=n.home?.name||n.homeTeam?.name||n.homeTeamName||n.home,a=n.away?.name||n.awayTeam?.name||n.awayTeamName||n.away,st=n.status,so=st&&typeof st==="object"?st:{},live=n.live===true||n.isLive===true||(typeof st==="string"&&/live|in.?progress|halftime|break/i.test(st)),started=so.started===true||n.started===true,finished=so.finished===true||n.finished===true;if(h&&a&&!finished&&(live||started)){const scoreVal=v=>{if(v==null)return null;if(typeof v==="number"||typeof v==="string")return v;if(typeof v==="object")return v.current??v.display??v.value??v.goals??v.score??v.total??v.regular??v.home??null;return null}; const sh=scoreVal(n.home?.score)??scoreVal(n.homeScore)??scoreVal(n.score?.home)??scoreVal(n.scoreHome)??scoreVal(n.scores?.home)??scoreVal(n.home?.goals)??scoreVal(n.home?.points)??scoreVal(n.home?.currentScore),sa=scoreVal(n.away?.score)??scoreVal(n.awayScore)??scoreVal(n.score?.away)??scoreVal(n.scoreAway)??scoreVal(n.scores?.away)??scoreVal(n.away?.goals)??scoreVal(n.away?.points)??scoreVal(n.away?.currentScore);const raw=n.minute??n.elapsed??n.time??so.minute??so.elapsed??"—";const parsedRaw=Date.parse(String(raw));const sm=startMs(n)|| (Number.isFinite(parsedRaw)?parsedRaw:null);const minute=/^\d{4}-\d{2}-\d{2}T/.test(String(raw))&&Number.isFinite(parsedRaw)?Math.max(0,Math.floor((Date.now()-parsedRaw)/60000)):raw;o.push({home:String(h),away:String(a),score:sh!=null&&sa!=null?sh+"–"+sa:"—",minute:String(minute),startMs:sm});return o}for(const v of Object.values(n))extract(v,o);return o};
          const json=async u=>{let last;for(let i=0;i<4;i++){try{const r=await fetch(u,{headers:{accept:"application/json"},signal:AbortSignal.timeout(15000)});console.log("HTTP",r.status,u);if(r.ok)return r.json();last=Error(u+" HTTP "+r.status);if(![429,500,502,503,504].includes(r.status))throw last;}catch(e){last=e}if(i<3)await new Promise(r=>setTimeout(r,1500*(i+1)))}throw last};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const polySportsSnapshot=()=>new Promise(resolve=>{
            const out=[];
            let ws;
            let done=false;
            const finish=()=>{if(done)return;done=true;try{ws&&ws.close()}catch{};resolve(out)};
            try{
              ws=new WebSocket("wss://sports-api.polymarket.com/ws");
              const timer=setTimeout(finish,5000);
              ws.onmessage=ev=>{
                try{
                  const d=JSON.parse(String(ev.data||""));
                  if(d==="ping"){try{ws.send("pong")}catch{};return}
                  if(d&&typeof d==="object"){
                    if(d.type==="ping"){try{ws.send("pong")}catch{};return}
                    if(d.gameId!=null||d.slug||d.homeTeam||d.awayTeam)out.push(d);
                  }
                }catch{}
              };
              ws.onerror=()=>{clearTimeout(timer);finish()};
              ws.onclose=()=>{clearTimeout(timer);finish()};
            }catch{finish()}
          });
          const gameIdOf=e=>{
            if(e?.gameId!=null)return String(e.gameId);
            for(const m of (Array.isArray(e?.markets)?e.markets:[]))
              if(m?.gameId!=null)return String(m.gameId);
            return "";
          };
          const soccerStateFor=(e,rows)=>{
            const gid=gameIdOf(e),slug=String(e?.slug||"").toLowerCase();
            const hit=rows.find(x=>(gid&&String(x.gameId||"")===gid)||(slug&&String(x.slug||"").toLowerCase()===slug));
            if(!hit)return null;
            const raw=hit.elapsed;
            let minute=null;
            if(typeof raw==="number"&&Number.isFinite(raw))minute=Math.floor(raw);
            else if(raw!=null){
              const m=String(raw).match(/\\d+(?:\\.\\d+)?/);
              if(m)minute=Math.floor(Number(m[0]));
            }
            return {minute,score:hit.score??null,period:hit.period??null,gameId:hit.gameId??null,slug:hit.slug??null,status:hit.status??null};
          };
          const seen=new Set();
          for(let cycle=1;cycle<=8;cycle++){
          console.log("MONITOR_CYCLE",cycle);
          const ld=await json(LIVE_URL),live=extract(ld);
          const base="https://gamma-api.polymarket.com/events?active=true&closed=false&live=true&limit=500"; const tags=["soccer","football"]; const pages=await Promise.all(tags.map(async tag=>{try{const p=await json(base+"&tag_slug="+encodeURIComponent(tag));return Array.isArray(p)?p:(p.events||[])}catch{return[]}})); const events=[...new Map(pages.flat().map(e=>[String(e.id),e])).values()];
          console.log("LIVE_COUNT",live.length); console.log("LIVE_SAMPLE",JSON.stringify(live.slice(0,10))); const sports=events.filter(e=>e.sport==="soccer"||e.sport==="football"||e.eventDate||e.startTime).slice(0,30).map(e=>({id:e.id,title:e.title,slug:e.slug,eventDate:e.eventDate,startTime:e.startTime,live:e.live,score:e.score,period:e.period,teams:e.teams,sport:e.sport,gameId:e.gameId,marketGameStart:Array.isArray(e.markets)&&e.markets[0]?.gameStartTime})); console.log("SPORTS_SAMPLE",JSON.stringify(sports)); const polySports=await polySportsSnapshot(); console.log("POLY_SPORTS_WS_COUNT",polySports.length); console.log("POLY_SPORTS_WS_SAMPLE",JSON.stringify(polySports.slice(0,8)));\n          console.log("POLY_EVENT_COUNT",events.length); const candidates=[]; for(const e of events){const title=String(e.title||e.name||""); const qs=(Array.isArray(e.markets)?e.markets:[]).map(m=>String(m.question||m.title||"")).filter(q=>/\b(?:vs\.?|v\.?|versus)\b/i.test(q)); if(/\b(?:vs\.?|v\.?|versus)\b/i.test(title)||qs.length)candidates.push({id:e.id,title,slug:e.slug,startDate:e.startDate,endDate:e.endDate,keys:Object.keys(e),questions:qs.slice(0,3),marketKeys:Array.isArray(e.markets)&&e.markets[0]?Object.keys(e.markets[0]):[]});} console.log("MATCH_CANDIDATES",JSON.stringify(candidates.slice(0,30)));
          console.log("POLY_SAMPLE",JSON.stringify(events.slice(0,5).map(e=>({id:e.id,title:e.title,name:e.name,slug:e.slug,startTime:e.startTime,startDate:e.startDate,endDate:e.endDate,homeTeamName:e.homeTeamName,awayTeamName:e.awayTeamName,homeTeam:e.homeTeam,awayTeam:e.awayTeam,markets:e.markets})),null,2).slice(0,12000));
          const teamNames=e=>{const out=[]; const add=v=>{if(typeof v==="string"&&v.trim())out.push(v.trim()); else if(v&&typeof v==="object"){const n=v.name||v.teamName||v.title; if(typeof n==="string"&&n.trim())out.push(n.trim());}}; add(e.homeTeam); add(e.awayTeam); add(e.home); add(e.away); add(e.homeTeamName); add(e.awayTeamName); if(Array.isArray(e.teams))e.teams.forEach(add); return [...new Set(out)];}; const eventTeams=e=>{const t=teamNames(e); if(t.length>=2)return [t[0],t[1]]; const title=String(e.title||e.name||"").replace(/\s+-\s+(?:More Markets|Halftime Result|Second Half Result|Corners|Cards|O\/U.*)$/i,"").trim(); const q=(Array.isArray(e.markets)?e.markets:[]).map(m=>String(m.question||m.title||"")).find(x=>/\s+(?:vs\.?|v\.?|versus)\s+/i.test(x)); const s=q||title; const p=s.split(/\s+(?:vs\.?|v\.?|versus)\s+/i); return p.length===2?[p[0].trim(),p[1].trim()]:null;}; let found=null; for(const l of live)for(const e of events){const p=eventTeams(e); if(!p)continue; const score=Math.max(sim(l.home,p[0])+sim(l.away,p[1]),sim(l.home,p[1])+sim(l.away,p[0])); if(score<1.25)continue; if(!found||score>found.score)found={l,e,score,timeOk:false,polyHome:p[0],polyAway:p[1]};};
          if(found){
  const wsState=soccerStateFor(found.e,polySports);
  console.log("POLY_SPORTS_MATCH",JSON.stringify(wsState));
  if(wsState?.minute!=null){
    found.l.minute=String(wsState.minute);
    found.l.minuteSource="Polymarket Sports WS";
  }else{
    const directMinute=found.e.elapsed??found.e.minute??found.e.currentMinute??found.e.gameMinute??found.e.clockMinute;
    if(directMinute!=null&&/^\\d+(?:\\.\\d+)?$/.test(String(directMinute).trim())){
      found.l.minute=String(Math.floor(Number(directMinute)));
      found.l.minuteSource="Polymarket elapsed";
    }
  }
  if(wsState?.score!=null&&/^\\s*\\d+\\s*[-–:]\\s*\\d+\\s*$/.test(String(wsState.score))){
    found.l.score=String(wsState.score).replace(/:/,"–").replace(/-/,"–");
    found.l.scoreSource="Polymarket Sports WS";
  }else{
    const ps=found.e.score;
    if(typeof ps==="string"&&/^\\s*\\d+\\s*[-–:]\\s*\\d+\\s*$/.test(ps)){
      found.l.score=ps.replace(/:/,"–").replace(/-/,"–");
      found.l.scoreSource="Polymarket";
    }else if(ps&&typeof ps==="object"){
      const ph=ps.home??ps.homeScore??ps.currentHome??ps.homeTeam;
      const pa=ps.away??ps.awayScore??ps.currentAway??ps.awayTeam;
      if(ph!=null&&pa!=null){found.l.score=String(ph)+"–"+String(pa);found.l.scoreSource="Polymarket";}
    }
  }
  console.log("BEST_MATCH",JSON.stringify({live:found.l,title:found.e.title,id:found.e.id,slug:found.e.slug,gameId:gameIdOf(found.e),score:found.score,timeOk:found.timeOk,wsState,polyScore:found.e.score,polyPeriod:found.e.period,polyElapsed:found.e.elapsed,polyMinute:found.e.minute,polyClock:found.e.clockMinute}));
}
          if(!process.env.TELEGRAM_BOT_TOKEN||!process.env.TELEGRAM_CHAT_ID)throw Error("GitHub Telegram secrets are missing");
          const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
          const link=found?.e?.slug?"https://polymarket.com/event/"+found.e.slug:"https://polymarket.com/sports/soccer";
          const matchKey=found?.e?.id?String(found.e.id):"";
          const text=found&&found.score>=1.25&&!seen.has(matchKey)?"⚽ <b>LIVE FOUND</b>\n\n"+esc(found.l.home)+" vs "+esc(found.l.away)+"\nLIVE\nMINUTE: "+esc(found.l.minute)+"\nSCORE: "+esc(found.l.score)+"\n\n<a href=\""+esc(link)+"\">ОТКРЫТЬ POLYMARKET</a>":null;
          if(text){seen.add(matchKey);
          const tr=await fetch("https://api.telegram.org/bot"+process.env.TELEGRAM_BOT_TOKEN+"/sendMessage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,parse_mode:"HTML",text})}),tj=await tr.json();console.log("TELEGRAM_RESPONSE",JSON.stringify(tj));if(!tj.ok)throw Error("Telegram rejected: "+JSON.stringify(tj));}
          if(cycle<8) await sleep(30000);
          }
          NODE