name: MarginPad Liquidation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Collect MarginPad events for one 5m window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          end=$(( $(date +%s) + 300 ))
          while [ $(date +%s) -lt $end ]; do
            node src/index.js 2>&1 | tee -a monitor.log
            sleep 15
          done

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-log-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 7
