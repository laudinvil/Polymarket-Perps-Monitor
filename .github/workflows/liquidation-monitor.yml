name: MarginPad Liquidation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          timeout --signal=TERM 290s node src/index.js 2>&1 | tee monitor.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "Monitor window completed normally; next scheduled run continues monitoring."

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-log
          path: monitor.log
          retention-days: 7
