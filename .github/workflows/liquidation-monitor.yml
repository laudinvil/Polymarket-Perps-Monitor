name: MarginPad Liquidation Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check one closed 5m bucket
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js 2>&1 | tee monitor.log

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-monitor-log-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 7
