name: Reset BTC 5m state once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for current monitor run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..60}; do
            status=$(gh api repos/${{ github.repository }}/actions/runs/34103695931 --jq '.status' 2>/dev/null || true)
            echo "Current monitor run status: $status"
            if [ "$status" = "completed" ] || [ -z "$status" ]; then break; fi
            sleep 10
          done

      - name: Reset only BTC 5m state
        run: |
          test -f .monitor-state.json
          jq '.liquidationTimeframes["5m"].BTC = {imbalanceUsd:0,longUsd:0,shortUsd:0,longEvents:0,shortEvents:0,events:0,establishedSign:0,lastBucket:null,buckets:{}} | .updatedAt = now | .updatedAt |= todateiso8601' .monitor-state.json > .monitor-state.json.tmp
          mv .monitor-state.json.tmp .monitor-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-state.json
          git commit -m "Reset BTC 5m liquidation accumulation"
          git push

      - name: Remove this one-time workflow
        run: |
          git rm .github/workflows/reset-btc-5m-once.yml
          git commit -m "Remove one-time BTC 5m reset workflow"
          git push
