name: Crowd Flow Stats Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crowd-flow-stats.yml'

concurrency:
  group: crowd-flow-stats-bridge
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Read Crowd Flow stats from Convex
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          set -euo pipefail
          test -n "$CONVEX_URL"
          curl -fsS --retry 3 --retry-delay 2 \
            "$CONVEX_URL/crowd-flow/periods?symbol=BTC&limit=100" \
            -o /tmp/crowd-flow.json
          jq . /tmp/crowd-flow.json
