name: Repair football monitor pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-football-pipeline.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full strategy and merge current discovery
        shell: python
        run: |
          import subprocess, pathlib

          target = pathlib.Path("scripts/polymarket-football-live.js")
          base_ref = "151696414dbce1276a3b664b3cbff9b03d157959"
          current_ref = "a7d867c25943e5e256a3335a06117fca77ab24c6"

          def show(ref):
              return subprocess.check_output(["git","show",f"{ref}:{target}"], text=True)

          base = show(base_ref)
          current = show(current_ref)

          # Keep the complete, working strategy/Telegram implementation from
          # 1516964. Replace only its discovery layer with the current
          # event-first fixture discovery (including child-market grouping).
          cur_start = current.index("function eventUrl(event)")
          cur_discovery_end = current.index("\n\n\nasync function runCycle()")
          discovery = current[cur_start:cur_discovery_end]

          base_start = base.index("function eventUrl(event)")
          base_discovery_end = base.index("\nfunction stripHtml")
          rebuilt = base[:base_start] + discovery + base[base_discovery_end:]

          # Preserve the full strategy but use the requested 20-second cycle.
          rebuilt = rebuilt.replace("const POLL_MS = 10_000;", "const POLL_MS = 20_000;", 1)

          # Replace the old interval/setTimeout entrypoint with the continuous
          # 6-hour cycle runner from the current monitor.
          old_tail = base[base.rfind("function stop()"):]
          new_tail = current[current.rfind("async function main()"):]
          rebuilt = rebuilt.replace(old_tail, new_tail)

          target.write_text(rebuilt)
          print("rebuilt bytes:", len(rebuilt))
          print("strategy tick:", "async function tick()" in rebuilt)
          print("telegram sender:", "async function sendTelegram" in rebuilt)
          print("sportscore enrichment:", "async function enrichLiveMatches" in rebuilt)
          print("continuous main:", "async function main()" in rebuilt)
          print("20s poll:", "const POLL_MS = 20_000;" in rebuilt)

          if not all([
              "async function tick()" in rebuilt,
              "async function sendTelegram" in rebuilt,
              "async function enrichLiveMatches" in rebuilt,
              "async function main()" in rebuilt,
              "const POLL_MS = 20_000;" in rebuilt,
              "function discoverPolymarket()" in rebuilt,
              "fixture_event_grouped" in rebuilt,
              "maybeOneOneAlert" in rebuilt,
          ]):
              raise SystemExit("required football pipeline components missing")

          subprocess.run(["node","--check",str(target)], check=True)

          subprocess.run(["git","add",str(target)], check=True)
          subprocess.run(["git","config","user.name","github-actions[bot]"], check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git","commit","-m","Restore full football strategy with event-first discovery and 20s monitor"], check=True)
          subprocess.run(["git","push","origin","HEAD:main"], check=True)
