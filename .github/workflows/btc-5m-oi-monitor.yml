name: BTC 5M OI Monitor

on:
  schedule:
    - cron: "0-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-5m-oi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Run BTC 5M OI monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-5m-oi-monitor.js
