name: BTC 5M NEXT Market Monitor

on:
  push:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: btc-5m-next-market-monitor-v2
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Stop older BTC monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" |
          jq -r --argjson current "$GITHUB_RUN_ID" \
            '.workflow_runs[] | select(.workflow_id == 364449335 and .id != $current and (.status == "queued" or .status == "in_progress")) | .id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Cancelling old BTC monitor run $run_id"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Run BTC 5M NEXT market monitor
        env:
          CONVEX_URL: https://brainy-canary-207.eu-west-1.convex.cloud
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-5m-oi-monitor.js
