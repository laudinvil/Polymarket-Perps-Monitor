name: BTC Liquidation · MarginPad Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll MarginPad and capture raw sides
        run: |
          node <<'NODE' | tee marginpad-diagnostic.log
          const url = "https://marginpad.io/api/v1/liquidations/live?symbol=BTC&limit=400";
          const response = await fetch(url, {
            headers: { accept: "application/json" },
            signal: AbortSignal.timeout(10000)
          });
          if (!response.ok) throw new Error("MarginPad HTTP " + response.status);
          const body = await response.json();
          const events = Array.isArray(body?.events) ? body.events : [];
          const rows = events.map(e => ({
            ts: e.ts,
            iso: Number.isFinite(Number(e.ts)) ? new Date(Number(e.ts)).toISOString() : null,
            exchange: String(e.exchange || "").toUpperCase(),
            symbol: String(e.symbol || "").toUpperCase(),
            side: e.side,
            price: Number(e.price),
            qty: Number(e.qty),
            usd: Number(e.price) * Number(e.qty)
          })).filter(e => e.exchange === "HYPERLIQUID" && e.symbol === "BTC")
            .sort((a,b) => Number(b.ts) - Number(a.ts));

          console.log("=== RAW MARGINPAD BTC HYPERLIQUID EVENTS ===");
          for (const e of rows) console.log(JSON.stringify(e));
          console.log("\n=== SIDE COUNTS ===");
          const counts = {};
          for (const e of rows) counts[e.side] = (counts[e.side] || 0) + 1;
          console.log(JSON.stringify(counts));
          console.log("\n=== LATEST 20 ===");
          for (const e of rows.slice(0, 20)) console.log(JSON.stringify(e));
          NODE

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-btc-diagnostic-${{ github.run_id }}
          path: marginpad-diagnostic.log
          retention-days: 7
