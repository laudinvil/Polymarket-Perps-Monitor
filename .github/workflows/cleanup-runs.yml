name: Cleanup old workflow runs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the newest 20 completed runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const active = new Set(
              runs.filter(r => r.status === 'in_progress' || r.status === 'queued').map(r => r.id)
            );
            const completed = runs.filter(r => !active.has(r.id));
            const keep = new Set(completed.slice(0, 20).map(r => r.id));

            for (const run of runs) {
              if (active.has(run.id) || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.info(`Deleted run ${run.id} (#${run.run_number})`);
              } catch (error) {
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }
