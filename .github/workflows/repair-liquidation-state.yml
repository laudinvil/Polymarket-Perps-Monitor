name: Repair liquidation state persistence

on:
  push:
    paths:
      - '.github/workflows/repair-liquidation-state.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch persistent bucket state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text()

          old = "function emptySymbolState() {\n  return { imbalanceUsd: 0, longUsd: 0, shortUsd: 0, longEvents: 0, shortEvents: 0, events: 0, establishedSign: 0, lastBucket: null };\n}"
          new = "function emptySymbolState() {\n  return { imbalanceUsd: 0, longUsd: 0, shortUsd: 0, longEvents: 0, shortEvents: 0, events: 0, establishedSign: 0, lastBucket: null, buckets: {} };\n}"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  return { version: 2, updatedAt: new Date().toISOString(), sentAlerts: [...sentAlerts], liquidationTimeframes };"
          new = "  return { version: 3, updatedAt: new Date().toISOString(), sentAlerts: [...sentAlerts], liquidationTimeframes };"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    for (const timeframe of FRAMEWORKS) { const map = timeframeState.get(timeframe); for (const symbol of symbols) { const saved = state.liquidationTimeframes?.[timeframe]?.[symbol]; if (saved) map.set(symbol, { ...emptySymbolState(), ...saved }); } }"
          new = "    for (const timeframe of FRAMEWORKS) { const map = timeframeState.get(timeframe); for (const symbol of symbols) { const saved = state.liquidationTimeframes?.[timeframe]?.[symbol]; if (saved) map.set(symbol, { ...emptySymbolState(), ...saved, buckets: saved.buckets && typeof saved.buckets === 'object' ? saved.buckets : {} }); } }"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    const rows = extractHistoricalBuckets(json); const events = []; const buckets = new Set(); let timestampedRows = 0; let valuedRows = 0;"
          new = "    const rows = extractHistoricalBuckets(json); const events = []; const buckets = new Set(); let timestampedRows = 0; let valuedRows = 0;"
          assert old in s

          old = "console.log(`HISTORICAL ${timeframe} ${symbol}: rows=${rows.length} timestamped=${timestampedRows} buckets=${buckets.size} valued=${valuedRows} events=${events.length}`); return { events, buckets };"
          new = "console.log(`HISTORICAL ${timeframe} ${symbol}: rows=${rows.length} timestamped=${timestampedRows} buckets=${buckets.size} valued=${valuedRows} events=${events.length}`); return { events, buckets, available: true };"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  } catch (error) { console.warn(`HISTORICAL ${timeframe} ${symbol} FAILED: ${error.message}`); return { events: [], buckets: new Set() };"
          new = "  } catch (error) { console.warn(`HISTORICAL ${timeframe} ${symbol} FAILED: ${error.message}`); return { events: [], buckets: new Set(), available: false };"
          assert old in s
          s = s.replace(old, new, 1)

          old = "function bucketIsAvailable(source, timeframe, period) { if (Array.isArray(source)) return eventsForBucket(source, timeframe, period).length > 0; return source?.buckets?.has(period) || eventsForBucket(source, timeframe, period).length > 0; }"
          new = "function bucketIsAvailable(source, timeframe, period) { if (Array.isArray(source)) return true; return source?.available === true; }"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    const source = eventsBySymbol.get(symbol) || []; const state = map.get(symbol) || emptySymbolState(); if (state.lastBucket !== null && completedBucket <= state.lastBucket) continue;\n    if (!bucketIsAvailable(source, timeframe, completedBucket))"
          new = "    const source = eventsBySymbol.get(symbol) || []; const state = map.get(symbol) || emptySymbolState(); state.buckets = state.buckets && typeof state.buckets === 'object' ? state.buckets : {}; const bucketKey = String(completedBucket); if (state.buckets[bucketKey]) { if (state.lastBucket === null || completedBucket > state.lastBucket) state.lastBucket = completedBucket; map.set(symbol, state); continue; } if (state.lastBucket !== null && completedBucket <= state.lastBucket) continue;\n    if (!bucketIsAvailable(source, timeframe, completedBucket))"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    const before = state.imbalanceUsd; const oldSign = state.establishedSign || 0; state.imbalanceUsd += longUsd - shortUsd; state.longUsd += longUsd; state.shortUsd += shortUsd; state.longEvents += longEvents; state.shortEvents += shortEvents; state.events += longEvents + shortEvents; state.lastBucket = completedBucket;"
          new = "    const before = state.imbalanceUsd; const oldSign = state.establishedSign || 0; state.imbalanceUsd += longUsd - shortUsd; state.longUsd += longUsd; state.shortUsd += shortUsd; state.longEvents += longEvents; state.shortEvents += shortEvents; state.events += longEvents + shortEvents; state.lastBucket = completedBucket; state.buckets[bucketKey] = { longUsd, shortUsd, longEvents, shortEvents, events: longEvents + shortEvents };"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Validate syntax
        run: node --check src/index.js

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-liquidation-state.yml
          git add src/index.js
          git diff --cached --check
          git diff --cached -- src/index.js
          git commit -m 'fix: persist completed liquidation buckets'
          git push