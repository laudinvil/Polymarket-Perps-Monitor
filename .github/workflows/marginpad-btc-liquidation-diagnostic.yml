name: MarginPad · BTC Liquidation Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: marginpad-btc-liquidation-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Query MarginPad liquidation feed
        run: |
          node <<'NODE'
          const urls = [
            "https://marginpad.io/api/v1/feed",
            "https://marginpad.io/api/v1/liquidations/live?symbol=BTC&limit=20"
          ];

          for (const url of urls) {
            console.log("\n=== " + url + " ===");
            try {
              const r = await fetch(url, {
                headers: { accept: "application/json" },
                signal: AbortSignal.timeout(10000)
              });
              const text = await r.text();
              console.log("HTTP:", r.status);
              console.log("CONTENT-TYPE:", r.headers.get("content-type"));
              console.log("BODY:", text.slice(0, 12000));

              if (r.ok) {
                try {
                  const body = JSON.parse(text);
                  const events = Array.isArray(body?.events)
                    ? body.events
                    : Array.isArray(body?.data?.events)
                      ? body.data.events
                      : [];
                  console.log("EVENT_COUNT:", events.length);
                  console.log("BTC_EVENTS:", JSON.stringify(
                    events.filter(e => String(e?.symbol || "").toUpperCase() === "BTC")
                  ));
                } catch (e) {
                  console.log("JSON_PARSE_ERROR:", e.message);
                }
              }
            } catch (e) {
              console.log("REQUEST_ERROR:", e.message);
            }
          }
          NODE
