name: ESPORTS MAP1 OVERREACTION

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

concurrency:
  group: esports-map1-overreaction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CS2 map-1 overreaction monitor
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/esports-map1-overreaction.js

      - name: Persist monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/esports-map1-overreaction.json
          if git diff --cached --quiet; then
            echo "STATE_UNCHANGED"
          else
            git commit -m "Persist CS2 monitor state"
            git push
          fi
