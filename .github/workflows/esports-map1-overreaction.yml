name: ESPORTS MAP1 OVERREACTION

on:
  push:
    paths:
      - "scripts/esports-map1-overreaction.js"
      - ".github/workflows/esports-map1-overreaction.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: esports-map1-overreaction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run all-esports map-1 overreaction monitor
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/esports-map1-overreaction.js

