name: Polymarket Football · Live Discovery
# Restored full strategy pipeline; 20s continuous monitor
# Ensure latest cycle-entry fix is executed
# Run restored continuous entrypoint
run-name: Football monitor · event-first scan

on:
  push:
    paths:
      - 'scripts/polymarket-football-live.js'
  workflow_dispatch:
  schedule:
    - cron: "2 */6 * * *"

concurrency:
  group: polymarket-football-live
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Deploy Convex telemetry
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Run football monitor (20s cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: https://brainy-canary-207.eu-west-1.convex.site
        run: node scripts/polymarket-football-live.js

