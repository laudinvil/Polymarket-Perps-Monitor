name: Polymarket Football · Live Discovery
# Force a fresh deployment after strategy changes; push trigger is intentional.
# Tick-overlap guard deployed in monitor script.
# Direct 1:1 market discovery deployed.
# Continuous monitor; push trigger keeps the deployed monitor on the latest strategy.

on:
  workflow_dispatch:
  schedule:
    - cron: "2 */6 * * *"
  push:
    paths:
      - ".github/workflows/polymarket-football-live.yml"
      - "scripts/polymarket-football-live.js"
      - "convex/http.ts"
      - "convex/footballLogs.ts"
      - "convex/schema.ts"

concurrency:
  group: polymarket-football-live
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Deploy Convex telemetry
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy

      - name: Discover live Polymarket football
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: https://brainy-canary-207.eu-west-1.convex.site
        run: node scripts/polymarket-football-live.js

# Trigger corrected 0:0 match discovery strategy.
