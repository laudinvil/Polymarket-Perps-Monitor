name: Polymarket Football · Live Discovery
run-name: Football monitor · live-only
# forced live monitor restart

on:
  push:
    paths:
      - 'scripts/polymarket-live-only.js'
      - 'convex/http.ts'
      - 'convex/footballLogs.ts'
      - 'convex/schema.ts'
  workflow_dispatch:
  schedule:
    - cron: "2 */6 * * *"

concurrency:
  group: polymarket-football-live
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Deploy Convex telemetry
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy
      - name: Validate live-only monitor syntax
        run: node --check scripts/polymarket-live-only.js
      - name: Run live-only football monitor (15s cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: https://brainy-canary-207.eu-west-1.convex.site
        run: |
          set -u
          node scripts/polymarket-live-only.js > football-monitor.log 2>&1 &
          MONITOR_PID=$!
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            echo "===== FOOTBALL TELEMETRY $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
            curl -fsS --max-time 5 "https://brainy-canary-207.eu-west-1.convex.site/football/status?limit=20" || true
            echo
            sleep 30
          done
          wait "$MONITOR_PID"
      - name: Publish football diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-monitor-diagnostics
          path: football-monitor.log
          if-no-files-found: ignore
          retention-days: 3
