name: Pinax OHLCV Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pinax-ohclv-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINAX_API_KEY: ${{ secrets.PINAX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run Pinax OHLCV diagnostic
        run: node src/pinax-diagnostic.js
