name: Open Interest Monitor

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: open-interest-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Use GitHub's full 360-minute job window so the 6-hour schedule does not intentionally leave a 5-minute gap.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Continuous Open Interest monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OI_PROXY_URL: ${{ secrets.OI_PROXY_URL }}
          OI_PROXY_TOKEN: ${{ secrets.OI_PROXY_TOKEN }}
        run: node src/open-interest-monitor.js 2>&1 | tee open-interest-monitor.log

      - name: Upload Open Interest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-interest-monitor-${{ github.run_id }}
          path: open-interest-monitor.log
          if-no-files-found: ignore
          retention-days: 1
