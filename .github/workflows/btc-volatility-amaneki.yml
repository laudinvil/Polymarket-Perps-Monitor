name: BTC Volatility · Amaneki REST

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btc-volatility-amaneki.yml"
      - "scripts/btc-volatility-amaneki.js"

concurrency:
  group: btc-amaneki-volatility-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run BTC Amaneki volatility monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-volatility-amaneki.js
