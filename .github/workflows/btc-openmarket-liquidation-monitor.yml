name: BTC Liquidations · Direct WebSockets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btc-openmarket-liquidation-monitor.yml"
      - "scripts/btc-openmarket-liquidation-monitor.js"
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: btc-openmarket-liquidation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run BTC liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-openmarket-liquidation-monitor.js
