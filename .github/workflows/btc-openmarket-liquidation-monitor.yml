name: BTC Liquidations · OpenMarket

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btc-openmarket-liquidation-monitor.yml"
      - "scripts/btc-openmarket-liquidation-monitor.js"
      - "convex/btc5mState.ts"
      - "convex/schema.ts"
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: btc-openmarket-liquidation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Convex dependencies
        run: npm install

      - name: Deploy Convex logging functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd 'printf "CONVEX_URL=%s\n" "$CONVEX_URL" >> "$GITHUB_ENV"'

      - name: Run BTC liquidation monitor
        env:
          OPENMARKET_API_KEY: ${{ secrets.OPENMARKET_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDATION_USD: "0"
          CONVEX_URL: ${{ env.CONVEX_URL }}
        run: node scripts/btc-openmarket-liquidation-monitor.js
