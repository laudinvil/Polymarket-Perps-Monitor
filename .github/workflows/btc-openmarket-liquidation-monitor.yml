name: BTC Liquidations · OpenMarket

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: btc-openmarket-liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run BTC liquidation monitor
        env:
          OPENMARKET_API_KEY: ${{ secrets.OPENMARKET_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDATION_USD: "0"
        run: node scripts/btc-openmarket-liquidation-monitor.js
