name: PolyBackTest Positions 5M

on:
  push:
    paths:
      - 'scripts/polybacktest-positions-5m.js'
      - '.github/workflows/polybacktest-positions-5m.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: polybacktest-positions-5m
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run BTC positions 5M monitor
        run: node scripts/polybacktest-positions-5m.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
