name: TurboFlow Link Test

on:
  push:
    paths:
      - ".github/workflows/turboflow-link-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -H "Content-Type: application/json"             --data-binary @- <<'JSON'
          {
            "chat_id": "${TELEGRAM_CHAT_ID}",
            "text": "🔥 TURBOFLOW TEST\n\n<a href=\"turboflow-prod://wc\">ОТКРЫТЬ TURBOFLOW</a>",
            "parse_mode": "HTML",
            "disable_web_page_preview": true
          }
          JSON