name: Docker Image Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "monitor.js"
      - "bootstrap.js"
      - "package.json"
      - ".github/workflows/docker-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull published image
        run: docker pull ghcr.io/laudinvil/polymarket-perps-monitor:latest

      - name: Start container
        run: |
          docker run -d --name monitor-smoke -p 8080:8080 -e PORT=8080 ghcr.io/laudinvil/polymarket-perps-monitor:latest

      - name: Wait for container
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx monitor-smoke; then
              echo "CONTAINER_EXITED"
              docker ps -a
              docker logs monitor-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "HEALTH_TIMEOUT"
          docker ps -a
          docker logs monitor-smoke || true
          exit 1

      - name: Show health and logs
        if: always()
        run: |
          echo "=== CONTAINER STATUS ==="
          docker ps -a
          echo "=== CONTAINER LOGS ==="
          docker logs monitor-smoke || true
          echo "=== HEALTH ==="
          curl -sS http://127.0.0.1:8080/health || true

      - name: Stop container
        if: always()
        run: docker rm -f monitor-smoke || true
