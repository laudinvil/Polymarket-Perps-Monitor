name: Nutmegly LIVE Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/nutmegly-live-monitor.js"
      - ".github/workflows/nutmegly-live-monitor.yml"
      - "package.json"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Nutmegly LIVE monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start
