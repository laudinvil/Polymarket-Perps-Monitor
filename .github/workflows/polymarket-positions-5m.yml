name: Polymarket Positions 5M BTC

on:
  push:
    paths:
      - 'scripts/polymarket-positions-5m.js'
      - 'convex/**'
      - '.github/workflows/polymarket-positions-5m.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: polymarket-positions-5m
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Convex CLI
        run: npm install --no-save convex
      - name: Deploy Convex production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Run BTC positions 5M monitor
        run: node scripts/polymarket-positions-5m.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
