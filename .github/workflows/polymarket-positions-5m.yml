name: Polymarket Positions 5M BTC

on:
  push:
    paths:
      - 'scripts/polymarket-positions-5m.js'
      - '.github/workflows/polymarket-positions-5m.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: polymarket-positions-5m
  cancel-in-progress: true
  # Keep exactly one Positions 5M monitor run active.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stop legacy PolyBackTest Positions 5M run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/35434507029/cancel" || true

      - name: Run BTC positions 5M monitor
        run: node scripts/polymarket-positions-5m.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
