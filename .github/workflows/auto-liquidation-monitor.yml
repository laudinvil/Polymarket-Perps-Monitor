name: Auto Liquidation Monitor

on:
  workflow_dispatch:

concurrency:
  group: auto-liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Monitor continuously
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          for i in $(seq 1 70); do
            echo "=== monitor cycle $i $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            node src/index.js 2>&1 | tee -a monitor.log || true
            sleep 300
          done

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-liquidation-monitor-log-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 7
