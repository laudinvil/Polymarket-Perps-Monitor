name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .monitor-side-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor

      - name: Initialize side state
        run: |
          if [ ! -s .monitor-side-state.json ]; then
            printf '{\n  "5m": {"version": 1, "lastAlertSide": "LONG", "nextExpectedSide": "SHORT", "updatedAt": "%s"},\n  "15m": {"version": 1, "lastAlertSide": "LONG", "nextExpectedSide": "SHORT", "updatedAt": "%s"}\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .monitor-side-state.json
            echo "SIDE STATE INITIALIZED: 5m=LONG->SHORT 15m=LONG->SHORT"
          else
            node -e "const s=require('./.monitor-side-state.json'); for (const tf of ['5m','15m']) console.log('SIDE STATE RESTORED '+tf+': last='+(s[tf]?.lastAlertSide||'LONG')+' next='+(s[tf]?.nextExpectedSide||'SHORT'))"
          fi

      - name: Verify authoritative monitor source
        run: |
          node --check scripts/imbalance-all-timeframes.js
          if grep -R -n -E 'first-liquidation-5m|imbalance-5m-only' scripts package.json --exclude='*.log' 2>/dev/null; then
            echo "ERROR: legacy monitor reference detected in executable project files"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('scripts/imbalance-all-timeframes.js', 'utf8');
          const symbolsMatch = text.match(/const SYMBOLS\s*=\s*\[([^\]]+)\]/);
          if (!symbolsMatch) throw new Error('ERROR: SYMBOLS configuration not found');
          const symbols = [...symbolsMatch[1].matchAll(/['\"]([A-Z0-9]+)['\"]/g)].map(m => m[1]);
          const unique = [...new Set(symbols)];
          if (unique.length !== 1 || unique[0] !== 'BTC') throw new Error(`ERROR: expected BTC-only monitor, found ${unique.join(',')}`);
          console.log(`Configured monitored coins: ${unique.join(',')}`);

          const tfMatch = text.match(/const TIMEFRAMES\s*=\s*\[([^\]]+)\]/);
          if (!tfMatch) throw new Error('ERROR: TIMEFRAMES configuration not found');
          const timeframes = [...tfMatch[1].matchAll(/['\"]([^'\"]+)['\"]/g)].map(m => m[1]);
          if (timeframes.length !== 2 || timeframes[0] !== '5m' || timeframes[1] !== '15m') {
            throw new Error(`ERROR: expected independent 5m + 15m timeframes, found ${timeframes.join(',')}`);
          }
          console.log(`Configured timeframes: ${timeframes.join(',')}`);

          for (const required of [
            'const TIMEFRAME_MS =',
            'loadExpectedSide',
            'persistLastAlertSide',
            'periodAlreadyAlerted',
            'findClobMidpoint',
            'displaySide(side)'
          ]) {
            if (!text.includes(required)) throw new Error(`ERROR: required monitor feature missing: ${required}`);
          }

          if (text.includes('const DEDUPE_WINDOW_MS')) throw new Error('ERROR: obsolete DEDUPE_WINDOW_MS logic detected');
          if (text.includes('const TIMEFRAME = \'5m\'')) throw new Error('ERROR: obsolete single-timeframe configuration detected');
          if (!text.includes('ONE ALERT PER PERIOD PER TIMEFRAME')) throw new Error('ERROR: per-timeframe alert policy missing');
          if (!text.includes('CLOB midpoint price')) throw new Error('ERROR: CLOB midpoint pricing policy missing');

          console.log('Authoritative monitor verified: BTC only; independent 5m + 15m; one alert per period per timeframe; persistent side alternation; CLOB midpoint price.');
          NODE

      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            tail -n 300 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log monitor-stats.json .monitor-state.json .monitor-side-state.json 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore

      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
