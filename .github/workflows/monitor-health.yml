name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .liquidation-alert-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor

      - name: Verify authoritative monitor source
        run: |
          node --check scripts/authoritative-liquidation-monitor.js
          if grep -R -n -E 'first-liquidation-5m|imbalance-5m-only|QUIET_PERIOD_MS|29-minute|29M quiet' scripts package.json --exclude='*.log' 2>/dev/null; then
            echo "ERROR: removed legacy monitor logic detected in executable project files"
            exit 1
          fi
          if ! grep -q "const SYMBOLS = \['BTC', 'ETH', 'SOL', 'XRP', 'DOGE', 'BNB', 'HYPE'\]" scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: authoritative monitor is not configured for all 7 coins"
            exit 1
          fi
          if ! grep -q "const TIMEFRAME = '30m'" scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: authoritative monitor is not 30M"
            exit 1
          fi
          if ! grep -q "THIRTY_MINUTE_MS = 30 \* 60 \* 1000" scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: alert window is not 30 minutes"
            exit 1
          fi
          if ! grep -q "displaySide" scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: UP/DOWN display mapping is missing"
            exit 1
          fi
          if ! grep -q "NEXT +1" scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: NEXT +1 market link is missing"
            exit 1
          fi
          if grep -qE 'MIN_VOLUME|MIN_LIQUIDATION_VOLUME|volume.*1500|1500.*volume' scripts/authoritative-liquidation-monitor.js; then
            echo "ERROR: minimum volume filter detected"
            exit 1
          fi
          echo "Authoritative monitor verified: all 7 coins / 30M wall-clock window / one alert per 30M window / LONG=UP SHORT=DOWN / no volume minimum / NEXT +1 / individual liquidations / no imbalance / no streaks"

      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/authoritative-liquidation-monitor.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            tail -n 300 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log monitor-stats.json .monitor-state.json .liquidation-alert-state.json 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore

      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true

# Manual verification trigger: no monitor logic change.
