name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - '.monitor-state.json'
      - 'monitor-status.md'
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Continuous MarginPad monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node src/index.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!

          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            if ! kill -0 "$MONITOR_PID" 2>/dev/null; then
              break
            fi
            {
              echo "# MarginPad monitor live status"
              echo
              echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo
              echo '```text'
              tail -n 80 monitor.log
              echo '```'
            } > monitor-status.md

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor-status.md
            git diff --cached --quiet || git commit -m 'Update live monitor status'
            git push origin HEAD:monitor-status --force || true
          done

          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-auto-monitor-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 14
