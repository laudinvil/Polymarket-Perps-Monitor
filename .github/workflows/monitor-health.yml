name: Polymarket Outcome Imbalance Monitor

on:
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: polymarket-outcome-imbalance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore monitor history
        run: |
          set -euo pipefail
          git fetch origin monitor-status:monitor-status
          git checkout monitor-status -- monitor-history.log .monitor-state.json
          rm -f monitor.log monitor-live.log .convex-log-cursor monitor-stats.md
          test -s .monitor-state.json
          node -e 'const s=require("./.monitor-state.json"); if(s.strategy!=="polymarket-5m-resolved-outcome-imbalance") throw new Error("Invalid monitor state strategy"); if(!Number.isInteger(Number(s.upCount))||!Number.isInteger(Number(s.downCount))) throw new Error("Invalid cumulative counts"); console.log(`Restored cumulative state: UP=${s.upCount} DOWN=${s.downCount} IMBALANCE=${s.imbalance}`);'
      - name: Verify outcome monitor source
        run: |
          set -e
          node --check scripts/imbalance-all-timeframes.js
          node --check src/polymarket.js
          test -f scripts/imbalance-all-timeframes.js
          test -f src/polymarket.js
          grep -q "polymarket-5m-resolved-outcome-imbalance" scripts/imbalance-all-timeframes.js
          grep -q "findMarketByEpoch" scripts/imbalance-all-timeframes.js
          echo "Verified Polymarket resolved-outcome imbalance monitor source."
      - name: Continuous Polymarket outcome monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          START_TS=$(date +%s)
          DEADLINE=$((START_TS + 21000))
          MONITOR_PID=""
          stop_monitor() {
            if [ -n "$MONITOR_PID" ]; then
              kill "$MONITOR_PID" 2>/dev/null || true
              wait "$MONITOR_PID" 2>/dev/null || true
              MONITOR_PID=""
            fi
          }
          trap 'stop_monitor' EXIT TERM INT
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            REMAINING=$((DEADLINE - $(date +%s)))
            if [ "$REMAINING" -le 0 ]; then break; fi
            echo "[WATCHDOG] starting Polymarket outcome monitor; remaining=${REMAINING}s"
            timeout "$REMAINING" node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee -a monitor.log &
            MONITOR_PID=$!
            while kill -0 "$MONITOR_PID" 2>/dev/null; do
              sleep 60
              tail -n 500 monitor.log > monitor-live.log 2>/dev/null || true
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add monitor-history.log .monitor-state.json 2>/dev/null || true
              git add -f monitor-live.log 2>/dev/null || true
              git commit -m "Update live outcome imbalance monitor status" 2>/dev/null || true
              git push --force origin HEAD:monitor-status || true
            done
            wait "$MONITOR_PID" || true
            MONITOR_PID=""
            if [ "$(date +%s)" -lt "$DEADLINE" ]; then
              echo "[WATCHDOG] outcome monitor stopped unexpectedly; restarting without resetting state"
              sleep 5
            fi
          done
          echo "[WATCHDOG] 355-minute outcome monitor window completed"
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-imbalance-monitor-log
          path: monitor.log
          if-no-files-found: ignore
