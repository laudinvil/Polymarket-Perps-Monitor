name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .monitor-side-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor

      - name: Initialize side state
        run: |
          if [ ! -s .monitor-side-state.json ]; then
            printf '{\n  "version": 1,\n  "lastAlertSide": "LONG",\n  "nextExpectedSide": "SHORT",\n  "updatedAt": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .monitor-side-state.json
            echo "SIDE STATE INITIALIZED: last=LONG next=SHORT"
          else
            node -e "const s=require('./.monitor-side-state.json'); console.log('SIDE STATE RESTORED: last='+s.lastAlertSide+' next='+s.nextExpectedSide)"
          fi

      - name: Verify authoritative monitor source
        run: |
          node --check scripts/imbalance-all-timeframes.js
          if grep -R -n -E 'first-liquidation-5m|imbalance-5m-only' scripts package.json --exclude='*.log' 2>/dev/null; then
            echo "ERROR: legacy monitor reference detected in executable project files"
            exit 1
          fi
          if ! grep -q "const SYMBOLS = \['ETH', 'SOL', 'XRP', 'DOGE', 'BNB', 'HYPE'\]" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: authoritative monitor does not contain exactly the 6 enabled coins"
            exit 1
          fi
          if ! grep -q "const TIMEFRAME = '5m'" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: authoritative monitor is not 5M-only"
            exit 1
          fi
          if ! grep -q "const DEDUPE_WINDOW_MS = 5 \* 60 \* 1000" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: monitor window is not 5 minutes"
            exit 1
          fi
          if ! grep -q "loadExpectedSide" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: monitor does not restore persistent side state"
            exit 1
          fi
          if ! grep -q "persistLastAlertSide" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: monitor does not persist the side after an alert"
            exit 1
          fi
          if ! grep -q "if (periodAlreadyAlerted) return" scripts/imbalance-all-timeframes.js; then
            echo "ERROR: monitor does not enforce one alert per 5-minute period"
            exit 1
          fi
          echo "Authoritative monitor verified: ONLY 5M / ETH SOL XRP DOGE BNB HYPE / BTC disabled / one coin per period / alternating side persists across restarts"

      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            tail -n 300 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log monitor-stats.json .monitor-state.json .monitor-side-state.json 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore

      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
