name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .liquidation-alert-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor
      - name: Verify authoritative monitor source
        run: |
          set -e
          test -f scripts/authoritative-liquidation-monitor.js
          node --check scripts/authoritative-liquidation-monitor.js
          if grep -R -n -E 'first-liquidation-5m|imbalance-5m-only|QUIET_PERIOD_MS|29-minute|29M quiet' scripts package.json --exclude='*.log' 2>/dev/null; then
            echo "ERROR: obsolete monitor logic detected in executable project files"
            exit 1
          fi
          if grep -R -n -E 'MIN_VOLUME|MIN_LIQUIDATION_VOLUME|volume.*1500|1500.*volume' scripts/authoritative-liquidation-monitor.js 2>/dev/null; then
            echo "ERROR: obsolete minimum-volume filter detected"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('scripts/authoritative-liquidation-monitor.js', 'utf8');
          for (const symbol of ['BTC','ETH','SOL','XRP','DOGE','BNB','HYPE']) {
            if (!src.includes(`'${symbol}'`)) throw new Error(`Missing required symbol: ${symbol}`);
          }
          if (!src.includes("const TIMEFRAME = '5m'")) throw new Error('Monitor timeframe is not 5m');
          if (!src.includes('bucketStart(ts, TIMEFRAME)')) throw new Error('5m aligned market boundaries are missing');
          if (!src.includes('pendingBySymbol')) throw new Error('Deferred liquidation state is missing');
          if (!src.includes('LIQUIDATION IN N => NO ALERT')) throw new Error('No-alert-in-source-window rule is missing');
          if (!src.includes('NO LIQUIDATION IN N+1')) throw new Error('Quiet-next-window rule is missing');
          if (!src.includes('currentWindow - FIVE_MINUTE_MS')) throw new Error('Immediate next 5m window check is missing');
          if (!src.includes('PENDING CANCEL')) throw new Error('Pending cancellation on next-window liquidation is missing');
          if (!src.includes('findNextMarket')) throw new Error('NEXT market lookup is missing');
          if (!src.includes('currentBucket + FIVE_MINUTE_MS')) throw new Error('Alert link is not NEXT market');
          if (!src.includes('hasAlerted')) throw new Error('One-alert-per-window guard is missing');
          if (!src.includes("if (side !== 'LONG' && side !== 'SHORT') continue")) throw new Error('LONG+SHORT direction filter is missing');
          if (!src.includes("side === 'LONG' ? 'UP' : 'DOWN'")) throw new Error('LONG to UP / SHORT to DOWN alert mapping is missing');
          NODE
          echo "Authoritative monitor source verified: 7 coins / 5m windows / liquidation N => no alert / quiet N+1 => alert with NEXT market / LONG=>UP + SHORT=>DOWN."
      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/authoritative-liquidation-monitor.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            tail -n 300 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log monitor-stats.json .monitor-state.json .liquidation-alert-state.json 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push --force origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore
      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
