name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json 2>/dev/null || true
          git checkout main -- .github/workflows/monitor-health.yml scripts/imbalance-all-timeframes.js 2>/dev/null || true

      - name: Verify monitor source configuration
        run: |
          node --check src/liquidation-monitor.js
          node --check scripts/imbalance-all-timeframes.js
          echo "Authoritative liquidation imbalance source syntax verified: 5m, 15m, 1h, 4h"

      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor.log monitor-history.log monitor-stats.json .monitor-state.json 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore

      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
