name: Line Movement Monitor

on:
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .monitor-side-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor monitor-stats.md
      - name: Verify line movement source
        run: |
          set -e
          node --check scripts/imbalance-all-timeframes.js
          node --check scripts/line-movement-monitor.js
          node --check scripts/convex-sync.js
          node --check src/telegram.js
      - name: Continuous line movement monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          ODDS_SPORT: football
          ODDS_LEAGUE: england-premier-league
          ODDS_BOOKMAKERS: Bet365,Unibet
          ODDS_MARKET: Totals
          ODDS_SELECTION: over
          ODDS_LINE: 2.5
          ODDS_MOVE_THRESHOLD_PERCENT: 5
          ODDS_MIN_BOOKMAKERS: 2
          ODDS_POLL_SECONDS: 600
          ODDS_EVENTS_REFRESH_MINUTES: 30
          ODDS_LOOKAHEAD_HOURS: 48
          ODDS_MAX_EVENTS: 10
        run: |
          set -uo pipefail
          test -n "$ODDS_API_KEY"
          timeout 20s node scripts/convex-sync.js start || true
          START_TS=$(date +%s)
          DEADLINE=$((START_TS + 21000))
          timeout "$((DEADLINE - $(date +%s)))" node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee -a monitor.log
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-movement-log
          path: monitor.log
          if-no-files-found: ignore
      - name: Finish Convex run
        if: always()
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
