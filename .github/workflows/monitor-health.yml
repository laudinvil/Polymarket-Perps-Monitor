name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore monitor history
        run: |
          git fetch origin monitor-status --depth=1 || true
          git show origin/monitor-status:monitor-history.log > monitor-history.log 2>/dev/null || :
          touch monitor-history.log
      - name: Verify monitor source configuration
        run: |
          node --check src/liquidation-monitor.js
          node --check scripts/imbalance-5m-only.js
          echo "All liquidation imbalance timeframes source syntax verified"
      - name: Continuous MarginPad monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          echo "Starting authoritative liquidation imbalance monitor run $GITHUB_RUN_NUMBER (ID $GITHUB_RUN_ID) at commit $GITHUB_SHA"
          node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/imbalance-5m-only.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          HISTORY_LINES=0
          MONITOR_STATUS=completed
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            if ! kill -0 "$MONITOR_PID" 2>/dev/null; then break; fi
            echo "MONITOR HEARTBEAT: pid=$MONITOR_PID alive=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> monitor.log
            LAST_MODIFIED=$(stat -c %Y monitor.log 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            STALE_SECONDS=$((NOW_TS - LAST_MODIFIED))
            if [ "$LAST_MODIFIED" -gt 0 ] && [ "$STALE_SECONDS" -ge 240 ]; then
              echo "MONITOR WATCHDOG: stale monitor.log for ${STALE_SECONDS}s; restarting monitor; pid=$MONITOR_PID"
              tail -n 20 monitor.log || true
              kill "$MONITOR_PID" 2>/dev/null || true
              sleep 2
              pkill -TERM -P "$MONITOR_PID" 2>/dev/null || true
              wait "$MONITOR_PID" 2>/dev/null || true
              node -r ./src/http-timeout.js scripts/imbalance-5m-only.js 2>&1 | tee -a monitor.log &
              MONITOR_PID=$!
              echo "MONITOR WATCHDOG: restarted monitor pid=$MONITOR_PID"
            fi
            NEW_LINES=$(wc -l < monitor.log)
            if [ "$NEW_LINES" -gt "$HISTORY_LINES" ]; then
              tail -n +$((HISTORY_LINES + 1)) monitor.log >> monitor-history.log
              HISTORY_LINES=$NEW_LINES
            fi
            node scripts/convex-sync.js sync || true
            tail -n 50000 monitor-history.log > monitor-history.tmp
            mv monitor-history.tmp monitor-history.log
            tail -n 5000 monitor.log > monitor-live.log
            node scripts/build-monitor-stats.js monitor-history.log
            {
              echo "# MarginPad monitor live status"
              echo
              echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Run: $GITHUB_RUN_NUMBER (ID $GITHUB_RUN_ID)"
              echo "Status: RUNNING"
              echo
              echo '```text'
              tail -n 500 monitor.log
              echo '```'
            } > monitor-status.md
            git fetch origin monitor-status --depth=1 || true
            rm -rf /tmp/monitor-status-worktree
            git worktree prune
            git worktree add --detach /tmp/monitor-status-worktree origin/monitor-status
            cp monitor-status.md monitor-stats.md monitor-live.log monitor-history.log /tmp/monitor-status-worktree/
            git -C /tmp/monitor-status-worktree config user.name 'github-actions[bot]'
            git -C /tmp/monitor-status-worktree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C /tmp/monitor-status-worktree add monitor-status.md monitor-stats.md monitor-live.log monitor-history.log
            git -C /tmp/monitor-status-worktree diff --cached --quiet || git -C /tmp/monitor-status-worktree commit -m 'Persist monitor history and statistics'
            git -C /tmp/monitor-status-worktree push origin HEAD:monitor-status || true
            git worktree remove /tmp/monitor-status-worktree --force || true
          done
          if ! wait "$MONITOR_PID"; then MONITOR_STATUS=failed; fi
          node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
          test "$MONITOR_STATUS" = completed
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-auto-monitor-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
