name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - '.monitor-state.json'
      - 'monitor-status.md'
      - 'monitor-live.log'
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

# Every new monitor run gets its own concurrency group so a stale/queued run
# cannot block the latest monitor. The latest run explicitly cancels older
# runs at startup before starting the actual monitor process.
concurrency:
  group: marginpad-auto-monitor-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Cancel older monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Current monitor run: $CURRENT_RUN_ID"
          runs=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs?workflow_id=349192156&per_page=50")

          echo "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '
            .workflow_runs[]
            | select((.id|tostring) != $current)
            | select(.status == "queued" or .status == "in_progress" or .status == "pending")
            | .id
          ' | while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Cancelling older monitor run $run_id"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$run_id/cancel" \
              -o /dev/null
          done

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Continuous MarginPad monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node src/index.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!

          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 300
            if ! kill -0 "$MONITOR_PID" 2>/dev/null; then
              break
            fi

            {
              echo "# MarginPad monitor live status"
              echo
              echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Run: $GITHUB_RUN_NUMBER (ID $GITHUB_RUN_ID)"
              echo "Status: RUNNING"
              echo
              echo '```text'
              tail -n 120 monitor.log
              echo '```'
            } > monitor-status.md

            tail -n 500 monitor.log > monitor-live.log

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor-status.md
            git add -f monitor-live.log
            git diff --cached --quiet || git commit -m 'Update live monitor logs'
            timeout 15s git push origin HEAD:monitor-status --force || true
          done

          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-auto-monitor-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 14
