name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .monitor-side-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor monitor-stats.md
      - name: Verify monitor source
        run: |
          node --check scripts/imbalance-all-timeframes.js
          node --check src/liquidation-monitor.js
          node --check src/polymarket.js
          node --check scripts/build-monitor-stats.js
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('scripts/imbalance-all-timeframes.js', 'utf8');
          const m = text.match(/const SYMBOLS\s*=\s*\[([^\]]+)\]/);
          if (!m) throw new Error('SYMBOLS configuration missing');
          const symbols = [...m[1].matchAll(/['\"]([A-Z0-9]+)['\"]/g)].map(x => x[1]);
          if (symbols.join(',') !== 'BTC,ETH,SOL') throw new Error(`Expected BTC,ETH,SOL only; found ${symbols.join(',')}`);
          if (!/const TIMEFRAME\s*=\s*['\"]5m['\"]/.test(text)) throw new Error('Expected 5m timeframe');
          if (!/FIRST-LIQUIDATION ALERT SENT/i.test(text)) throw new Error('Current first-liquidation alert path missing');
          if (!/periodAlreadyAlerted/.test(text)) throw new Error('Per-period alert guard missing');
          if (!/findNextMarket\(symbol, alertNow, '5m'\)/.test(text)) throw new Error('NEXT 5m lookup missing');
          if (!/findNextMarket\(symbol, alertNow, '15m'\)/.test(text)) throw new Error('NEXT 15m lookup missing');
          if (/findClobMidpoint\s*\(/.test(text)) throw new Error('Obsolete CURRENT CLOB price lookup detected');
          if (/CURRENT\s+Polymarket|CURRENT\s+market/i.test(text)) throw new Error('Obsolete CURRENT market alert content detected');
          console.log('Verified: BTC+ETH+SOL; 5m; per-period first liquidation; NEXT 5m + NEXT 15m only; no current market/price lookup.');
          NODE
      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          timeout 330m node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          trap 'status=$?; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log || true
            tail -n 500 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log .monitor-state.json .monitor-side-state.json monitor-stats.md 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update live BTC+ETH+SOL monitor status" 2>/dev/null || true
            git push --force origin HEAD:monitor-status || true
          done
          wait "$MONITOR_PID"
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore
      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
