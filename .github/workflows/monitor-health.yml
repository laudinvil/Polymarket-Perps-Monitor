name: MarginPad Liquidation Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-health.yml'
      - 'src/liquidation-monitor.js'
      - 'src/polymarket.js'
      - 'src/telegram.js'
      - 'scripts/liquidation-long-monitor.js'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-liquidation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore liquidation history
        run: |
          set -euo pipefail
          git fetch origin monitor-status:monitor-status || true
          if git cat-file -e monitor-status:.liquidation-state.json 2>/dev/null; then
            git show monitor-status:.liquidation-state.json > .liquidation-state.json
            echo "Restored liquidation state."
          else
            printf '{"lastAlertPeriod":null}\n' > .liquidation-state.json
            echo "No saved liquidation state; starting clean."
          fi
          rm -f monitor.log monitor-live.log
      - name: Verify liquidation monitor source
        run: |
          set -e
          node --check src/liquidation-monitor.js
          node --check scripts/liquidation-long-monitor.js
          node --check src/polymarket.js
          grep -q "DEFAULT_SYMBOLS = \['BTC', 'ETH', 'SOL'\]" src/liquidation-monitor.js
          grep -q "timeframe=10m" scripts/liquidation-long-monitor.js
          grep -q "all liquidation sides" scripts/liquidation-long-monitor.js
          grep -q "first liquidation alerts immediately" scripts/liquidation-long-monitor.js
          grep -q "findNextMarket" scripts/liquidation-long-monitor.js
          echo "Verified MarginPad BTC/ETH/SOL all-liquidation 10M first-alert monitor."
      - name: Continuous MarginPad liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          START_TS=$(date +%s)
          DEADLINE=$((START_TS + 21000))
          MONITOR_PID=""
          stop_monitor() {
            if [ -n "$MONITOR_PID" ]; then
              kill "$MONITOR_PID" 2>/dev/null || true
              wait "$MONITOR_PID" 2>/dev/null || true
              MONITOR_PID=""
            fi
          }
          trap 'stop_monitor' EXIT TERM INT
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            REMAINING=$((DEADLINE - $(date +%s)))
            if [ "$REMAINING" -le 0 ]; then break; fi
            echo "[WATCHDOG] starting MarginPad BTC/ETH/SOL all-liquidation 10M monitor; remaining=${REMAINING}s"
            timeout "$REMAINING" node -r ./src/http-timeout.js scripts/liquidation-long-monitor.js 2>&1 | tee -a monitor.log &
            MONITOR_PID=$!
            while kill -0 "$MONITOR_PID" 2>/dev/null; do
              sleep 60
              tail -n 500 monitor.log > monitor-live.log 2>/dev/null || true
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .liquidation-state.json 2>/dev/null || true
              git add -f monitor-live.log 2>/dev/null || true
              git commit -m "Update liquidation monitor status" 2>/dev/null || true
              git push --force origin HEAD:monitor-status || true
            done
            wait "$MONITOR_PID" || true
            MONITOR_PID=""
            if [ "$(date +%s)" -lt "$DEADLINE" ]; then
              echo "[WATCHDOG] liquidation monitor stopped unexpectedly; restarting without resetting state"
              sleep 5
            fi
          done
          echo "[WATCHDOG] 355-minute liquidation monitor window completed"
      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-long-monitor-log
          path: monitor.log
          if-no-files-found: ignore
