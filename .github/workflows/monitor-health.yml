name: MarginPad Auto Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status:monitor-status || true
          git checkout monitor-status -- monitor-history.log .monitor-state.json .monitor-side-state.json 2>/dev/null || true
          rm -f monitor.log monitor-live.log .convex-log-cursor

      - name: Verify authoritative monitor source
        run: |
          node --check scripts/imbalance-all-timeframes.js
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('scripts/imbalance-all-timeframes.js', 'utf8');
          const symbolsMatch = text.match(/const SYMBOLS\s*=\s*\[([^\]]+)\]/);
          if (!symbolsMatch) throw new Error('ERROR: SYMBOLS configuration not found');
          const symbols = [...symbolsMatch[1].matchAll(/['\"]([A-Z0-9]+)['\"]/g)].map(m => m[1]);
          const expected = ['BTC','ETH','SOL','XRP','DOGE','BNB','HYPE'];
          if (symbols.length !== expected.length || symbols.some((s, i) => s !== expected[i])) throw new Error(`ERROR: expected all 7 coins, found ${symbols.join(',')}`);
          console.log(`Configured monitored coins: ${symbols.join(',')}`);

          const tfMatch = text.match(/const TIMEFRAME\s*=\s*['\"]([^'\"]+)['\"]/);
          if (!tfMatch || tfMatch[1] !== '5m') throw new Error(`ERROR: expected 5m timeframe, found ${tfMatch?.[1] || 'missing'}`);
          console.log('Configured timeframe: 5m');

          const requiredPatterns = [
            /PERIOD_MS\s*=\s*5\s*\*\s*60\s*\*\s*1000/,
            /POLL_MS\s*=\s*4000/,
            /collectCurrentPeriodEvents\s*\(/,
            /armedAfterEmptyPeriod/,
            /periodEventCount\s*===\s*0/,
            /EMPTY PERIOD CONFIRMED/,
            /first_liquidation_after_empty_5m_period/,
            /findNextMarket\(symbol, Date\.now\(\), TIMEFRAME\)/,
            /POLYMARKET NEXT/,
            /individual events only/,
            /no imbalance/,
            /no streaks/,
            /LONG liquidation -> UP/,
            /SHORT liquidation -> DOWN/,
            /`UP`/,
            /`DOWN`/
          ];
          requiredPatterns.forEach((pattern) => {
            if (!pattern.test(text)) throw new Error(`ERROR: required monitor structure missing: ${pattern}`);
          });

          const obsolete = [
            'ACCELERATION_BUCKET_MS',
            'MIN_LATEST_COUNT',
            'buildAccelerationCandidates',
            'loadExpectedSide',
            'persistLastAlertSide',
            'expectedSide',
            'latest >= 4',
            '3 rising buckets',
            'ACTIVITY_BUCKET_MS',
            'REQUIRED_CONSECUTIVE_BUCKETS',
            'buildActivityCandidates',
            'rule=collective_all_coins_at_least_one_each_30s',
            'findMarketByEpoch',
            'findClobMidpoint',
            'CLOB MIDPOINT CURRENT',
            'POLYMARKET CURRENT',
            'CURRENT Polymarket Price',
            'CURRENT · Polymarket 5M',
            'AFTER EMPTY 5M PERIOD'
          ];
          for (const marker of obsolete) {
            if (text.includes(marker)) throw new Error(`ERROR: obsolete monitor logic detected: ${marker}`);
          }

          console.log('Authoritative monitor verified: all 7 coins; 5m; empty completed periods arm the monitor; first new liquidation triggers; one alert per armed period; individual liquidation events only; UP/DOWN mapping; next market only.');
          NODE

      - name: Continuous MarginPad monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARGINPAD_API_KEY: ${{ secrets.MARGINPAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          timeout 20s node scripts/convex-sync.js start || true
          node -r ./src/http-timeout.js scripts/imbalance-all-timeframes.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          MONITOR_STATUS=completed
          trap 'status=$?; if [ "$status" -ne 0 ]; then MONITOR_STATUS=failed; fi; kill "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 60
            timeout 20s node scripts/convex-sync.js sync || true
            node scripts/build-monitor-stats.js monitor-history.log
            tail -n 300 monitor.log > monitor-live.log 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor-history.log monitor-stats.json .monitor-state.json 2>/dev/null || true
            git add -f monitor-live.log 2>/dev/null || true
            git commit -m "Update monitor status" 2>/dev/null || true
            git push --force origin HEAD:monitor-status
          done
          wait "$MONITOR_PID"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log
          if-no-files-found: ignore

      - name: Finish Convex run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
          MONITOR_STATUS: ${{ job.status }}
        run: timeout 20s node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
