name: MarginPad Auto Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '1 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: marginpad-auto-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore monitor history
        run: |
          git fetch origin monitor-status --depth=1 || true
          git show origin/monitor-status:monitor-history.log > monitor-history.log 2>/dev/null || :
          touch monitor-history.log

      - name: Fix timeframe boundary detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.js')
          text = path.read_text()
          old = 'const due = bucketStart(current - BOUNDARY_GRACE_MS, timeframe) + size;'
          new = 'const due = bucketStart(current, timeframe);'
          if old not in text:
              raise SystemExit('Expected boundary expression not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Parallelize live liquidation fetches
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.js')
          text = path.read_text()
          old = "async function processLive(timeframe, boundary) { for (const symbol of symbols) { const events = await fetchSymbolFeed(symbol); const state = timeframeState.get(timeframe).get(symbol) || emptySymbolState(); const period = bucketStart(boundary - 1, timeframe); let longUsd = 0, shortUsd = 0, longEvents = 0, shortEvents = 0; for (const event of events || []) { const ts = normalizeTs(event); if (!Number.isFinite(ts) || bucketStart(ts, timeframe) !== period) continue; const side = eventSideSign(event), value = eventNotionalUsd(event); if (side > 0) { longUsd += value; longEvents++; } else if (side < 0) { shortUsd += value; shortEvents++; } } const before = state.imbalanceUsd; const next = applyCompletedBucket(timeframe, symbol, period, longUsd, shortUsd, longEvents, shortEvents); if (!next) continue; console.log(JSON.stringify({ timeframe, symbol, period, longUsd, shortUsd, imbalanceUsd: next.imbalanceUsd, establishedSign: next.establishedSign, lastBucket: next.lastBucket })); const crossing = crossingFor(timeframe, symbol, before, next.imbalanceUsd, period); if (crossing) await sendCrossingAlert(crossing, next, longUsd, shortUsd, longEvents, shortEvents); } }"
          new = "async function processLive(timeframe, boundary) { const period = bucketStart(boundary - 1, timeframe); await Promise.all(symbols.map(async symbol => { const events = await fetchSymbolFeed(symbol); const state = timeframeState.get(timeframe).get(symbol) || emptySymbolState(); let longUsd = 0, shortUsd = 0, longEvents = 0, shortEvents = 0; for (const event of events || []) { const ts = normalizeTs(event); if (!Number.isFinite(ts) || bucketStart(ts, timeframe) !== period) continue; const side = eventSideSign(event), value = eventNotionalUsd(event); if (side > 0) { longUsd += value; longEvents++; } else if (side < 0) { shortUsd += value; shortEvents++; } } const before = state.imbalanceUsd; const next = applyCompletedBucket(timeframe, symbol, period, longUsd, shortUsd, longEvents, shortEvents); if (!next) return; console.log(JSON.stringify({ timeframe, symbol, period, longUsd, shortUsd, imbalanceUsd: next.imbalanceUsd, establishedSign: next.establishedSign, lastBucket: next.lastBucket })); const crossing = crossingFor(timeframe, symbol, before, next.imbalanceUsd, period); if (crossing) await sendCrossingAlert(crossing, next, longUsd, shortUsd, longEvents, shortEvents); })); }"
          if old not in text:
              raise SystemExit('Expected processLive function not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Continuous MarginPad monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_INGEST_TOKEN: ${{ secrets.CONVEX_INGEST_TOKEN }}
        run: |
          set -o pipefail
          echo "Starting authoritative monitor run $GITHUB_RUN_NUMBER (ID $GITHUB_RUN_ID) at commit $GITHUB_SHA"
          node scripts/convex-sync.js start || true
          node src/index.js 2>&1 | tee monitor.log &
          MONITOR_PID=$!
          HISTORY_LINES=0
          MONITOR_STATUS=completed

          while kill -0 "$MONITOR_PID" 2>/dev/null; do
            sleep 300
            if ! kill -0 "$MONITOR_PID" 2>/dev/null; then
              break
            fi

            NEW_LINES=$(wc -l < monitor.log)
            if [ "$NEW_LINES" -gt "$HISTORY_LINES" ]; then
              tail -n +$((HISTORY_LINES + 1)) monitor.log >> monitor-history.log
              HISTORY_LINES=$NEW_LINES
            fi

            node scripts/convex-sync.js sync || true
            tail -n 50000 monitor-history.log > monitor-history.tmp
            mv monitor-history.tmp monitor-history.log
            tail -n 5000 monitor.log > monitor-live.log
            node scripts/build-monitor-stats.js monitor-history.log

            {
              echo "# MarginPad monitor live status"
              echo
              echo "Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Run: $GITHUB_RUN_NUMBER (ID $GITHUB_RUN_ID)"
              echo "Status: RUNNING"
              echo
              echo '```text'
              tail -n 500 monitor.log
              echo '```'
            } > monitor-status.md

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor-status.md monitor-stats.md
            git add -f monitor-live.log monitor-history.log
            git diff --cached --quiet || git commit -m 'Persist monitor history and statistics'
            timeout 15s git push origin HEAD:monitor-status --force || true
          done

          if ! wait "$MONITOR_PID"; then
            MONITOR_STATUS=failed
          fi
          node scripts/convex-sync.js finish "$MONITOR_STATUS" || true
          test "$MONITOR_STATUS" = completed

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marginpad-auto-monitor-${{ github.run_id }}
          path: monitor.log
          if-no-files-found: ignore
          retention-days: 14
