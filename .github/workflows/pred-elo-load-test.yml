name: Pred ELO load test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run pred-ELO load test
        run: node pred-elo/index.js
        timeout-minutes: 10
