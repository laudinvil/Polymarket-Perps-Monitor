name: BTC Micro Signals · RV RSI Return

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btc-micro-signals.yml"
      - "scripts/btc-micro-signals.js"

concurrency:
  group: btc-micro-signals-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run BTC Micro Signals monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/btc-micro-signals.js