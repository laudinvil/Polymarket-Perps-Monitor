name: Equal Liquidations Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/equal-liquidations-monitor.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: equal-liquidations-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run MarginPad equal liquidation monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node src/equal-liquidations-monitor.js
