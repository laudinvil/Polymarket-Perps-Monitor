name: Convex Runtime Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convex-runtime-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Convex runtime
        run: |
          set -e
          base='https://brainy-canary-207.eu-west-1.convex.site'
          echo '=== HEALTH ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 "$base/health"
          echo
          echo '=== RUNTIME STATUS ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 "$base/runtime/status"
          echo
          echo '=== RUNTIME RUNS ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 "$base/runtime/runs?limit=10"
          echo
          echo '=== RUNTIME LOGS ==='
          curl --fail-with-body --retry 3 --retry-delay 2 --max-time 30 "$base/runtime/logs?limit=100"
          echo
